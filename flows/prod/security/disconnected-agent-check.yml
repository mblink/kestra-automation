id: disconnected-agent-check
namespace: prod.security

description: |
  Find disconnected wazuh agents and restart them. Migrated from Rundeck job
  Prod/Security/Disconnected Agent Check (6e1284fa).

  BROKEN EXPORT: the source job's <schedule> block was empty/missing entirely
  (scheduleEnabled: true, but no cron data survived export — same class of gap
  as saltrun-rundeck-backup.yml). Every flow in this repo is required to have
  a triggers: block (enforced by tests/test_flow_structure.py), so the cron
  below ("0 * * * *", hourly — a guess matching this being a health-check/
  remediation job) is fabricated, not sourced from Rundeck. disabled: true
  until a real schedule is confirmed against live Rundeck.

  No <nodefilters> block at all; the script itself SSHes into prodops02 (as
  bldeploy) to query wazuh-master/worker containers, so it must run from a
  host with bldeploy's own SSH access already configured — targets prodsalt as
  an assumption, matching every other nodefilter-less job in this repo —
  confirm against the live Rundeck job's resolved node list before treating
  this as validated.

  wazuh/connect_agents.sh lives in namespace-files/prod.security/ and is pulled
  in via {{ read('connect_agents.sh') }}. Source of truth remains rundeck-jobs'
  wazuh/connect_agents.sh.

tasks:
  - id: check_agents
    type: io.kestra.plugin.fs.ssh.Command
    host: prodsalt.bondlink.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        cat > /tmp/connect_agents.sh <<'CONNECT_AGENTS_SCRIPT'
        {{ read('connect_agents.sh') }}
        CONNECT_AGENTS_SCRIPT
        chmod +x /tmp/connect_agents.sh
        /tmp/connect_agents.sh
        rm -f /tmp/connect_agents.sh

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    timezone: UTC
    disabled: true

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Failed to reconnect agent"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].taskId }}
