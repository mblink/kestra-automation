id: disconnected-agent-check
namespace: prod.security

description: |
  Find disconnected wazuh agents and restart them. Runs on prodsalt; the script
  itself SSHes into prodops02 (as bldeploy) to query the wazuh-master/worker
  containers, so it needs a host with bldeploy's own SSH access already
  configured.

  PLACEHOLDER TRIGGER: the cron below ("0 * * * *", hourly) is a guess matching
  this being a health-check/remediation job, not a cadence anyone chose, and the
  trigger carries disabled: true. Pick a real schedule before enabling it.

  wazuh/connect_agents.sh is inlined below (quoted heredoc) rather than pulled
  from Namespace Files — it's only used by this one flow.

tasks:
  - id: check_agents
    type: io.kestra.plugin.fs.ssh.Command
    host: prodsalt.bondlink.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        cat > /tmp/connect_agents.sh <<'CONNECT_AGENTS_SCRIPT'
        #!/usr/bin/env bash
        set -e
        dockerImages='multi-node-wazuh.master-1 multi-node-wazuh.worker-1'
        DISCONNECTED=$(for container in ${dockerImages}; do
          sudo -u bldeploy ssh prodops02 "sudo docker exec $container /var/ossec/bin/agent_control -ln | grep ID | awk '{ print $4 }' | sed s/,//g"
        done)

        TRY_CONNECT=
        checkInstanceState() {
          /usr/local/bin/aws ec2 describe-instances --filter "Name=tag:Name,Values=$1" --query "Reservations[*].Instances[*].State" | jq '.[][].Name' | sed 's/"//g'
        }
        if [ ! -z "${DISCONNECTED}" ]; then
          for server in ${DISCONNECTED}; do
            iState=$(checkInstanceState $server)
            if [[ "$iState" = "running" && "${server}" != "prodsalt" ]]; then
              TRY_CONNECT="${TRY_CONNECT}$server "
            fi
          done;
          echo "TryConnect ${TRY_CONNECT}"
          if [ ! -z "${TRY_CONNECT}" ]; then

            SALT_DIS=$(echo "${TRY_CONNECT}" | sed 's/ /,/g' | sed 's/,$//')
            echo "Disconnected agents: ${SALT_DIS}"
            sudo salt -L "${SALT_DIS}" cmd.run "service wazuh-agent restart"
            r=$?
            echo "Salt result: $r"
            exit $r
          else
            echo "Instances were in a hibernated state"
            exit 0
          fi
        fi;
        CONNECT_AGENTS_SCRIPT
        chmod +x /tmp/connect_agents.sh
        /tmp/connect_agents.sh
        rm -f /tmp/connect_agents.sh

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    timezone: UTC
    disabled: true

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Failed to reconnect agent"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
