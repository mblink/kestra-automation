id: clean-drone-resources
namespace: prod.security

description: |
  Prune docker resources on CI build agents. Migrated from Rundeck job
  Prod/Security/Clean Drone Resources (c18e2825) — currently DISABLED in Rundeck
  (executionEnabled: false); run manually from the Kestra UI to test.

  PLACEHOLDER TRIGGER: every flow in this repo is required to have a triggers:
  block (enforced by tests/test_flow_structure.py), but the source Rundeck job
  never had a schedule to carry over (it was disabled before one was ever set).
  The cron below ("0 3 * * 0", weekly Sunday 3am — a guess at a reasonable
  maintenance-window cadence for a cleanup job) is fabricated, not sourced from
  Rundeck — confirm/replace it with a real intended schedule before flipping
  disabled to false.

  Targets the Woodpecker CI agents (Environment=prod, NodeType=woodpecker-agent,
  running) and starts each agent's salt-managed woodpecker-docker-clean.service, so
  the age-scoped reclaim policy lives in one script owned by salt.

tasks:
  - id: discover_drone_hosts
    type: io.kestra.plugin.aws.cli.AwsCLI
    outputFiles:
      - instances.json
    commands:
      - |
        aws ec2 describe-instances \
          --filters "Name=tag:Environment,Values=prod" "Name=tag:NodeType,Values=woodpecker-agent" "Name=instance-state-name,Values=running" \
          --query "Reservations[].Instances[].{Name: Tags[?Key=='Name']|[0].Value, PrivateDnsName: NetworkInterfaces[0].PrivateDnsName}" \
          --output json > instances.json

  - id: clean_servers
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ fromJson(read(outputs.discover_drone_hosts.outputFiles['instances.json'])) }}"
    concurrencyLimit: 0
    tasks:
      - id: clean
        type: io.kestra.plugin.fs.ssh.Command
        host: "{{ fromJson(taskrun.value).PrivateDnsName }}"
        port: "2007"
        username: bldeploy
        authMethod: PUBLIC_KEY
        privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
        strictHostKeyChecking: "no"
        commands:
          - |
            set -e
            echo "Cleaning docker resources on {{ fromJson(taskrun.value).Name }} ({{ fromJson(taskrun.value).PrivateDnsName }})"
            unit=woodpecker-docker-clean.service
            rc=0
            sudo systemctl start "$unit" || rc=$?
            systemctl show -p Result,ExecMainStatus,InvocationID "$unit"
            sudo journalctl _SYSTEMD_INVOCATION_ID="$(systemctl show -p InvocationID --value "$unit")" --no-pager
            result="$(systemctl show -p Result --value "$unit")"
            if [ "$rc" -ne 0 ] || [ "$result" != success ]; then
              echo "$unit failed: systemctl start exited $rc, Result=$result"
              exit 1
            fi

  - id: notify_success
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[prod_cron] Clean Drone Resources Success"
    htmlContent: "Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} succeeded."

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 * * 0"
    timezone: UTC
    disabled: true

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[prod_cron] Clean Drone Resources Failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].taskId }}
