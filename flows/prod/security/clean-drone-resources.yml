id: clean-drone-resources
namespace: prod.security

description: |
  Prune docker resources on drone build agents.

  Target hosts are discovered dynamically via AWS instance tags
  (Environment=prod, NodeType=drone-agent, running) — see bondlink-logs.yml for
  the discover_*_hosts task shape and its AwsCLI/IMDS prerequisite notes (already
  confirmed satisfied on prodsalt-arm, the host Kestra runs on).

  PLACEHOLDER TRIGGER: the cron below ("0 3 * * 0", weekly Sunday 3am) is a guess
  at a reasonable maintenance-window cadence, not a schedule anyone chose, and the
  trigger carries disabled: true. Replace it with a real intended schedule before
  enabling; run manually from the Kestra UI to test.

  UNVERIFIED SCHEDULE: this cron is a reconstruction, not a carried-over source schedule.

tasks:
  - id: discover_drone_hosts
    type: io.kestra.plugin.aws.cli.AwsCLI
    outputFiles:
      - instances.json
    commands:
      - |
        aws ec2 describe-instances \
          --filters "Name=tag:Environment,Values=prod" "Name=tag:NodeType,Values=drone-agent" "Name=instance-state-name,Values=running" \
          --query "Reservations[].Instances[].{Name: Tags[?Key=='Name']|[0].Value, PrivateDnsName: NetworkInterfaces[0].PrivateDnsName}" \
          --output json > instances.json

  - id: clean_servers
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ fromJson(read(outputs.discover_drone_hosts.outputFiles['instances.json'])) }}"
    concurrencyLimit: 0
    tasks:
      - id: clean
        type: io.kestra.plugin.fs.ssh.Command
        host: "{{ fromJson(taskrun.value).PrivateDnsName }}"
        port: "2007"
        username: bldeploy
        authMethod: PUBLIC_KEY
        privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
        strictHostKeyChecking: "no"
        commands:
          - |
            set -e
            echo "Cleaning docker resources on {{ fromJson(taskrun.value).Name }} ({{ fromJson(taskrun.value).PrivateDnsName }})"
            sudo docker rmi $(sudo docker images | grep '/bondlink' | awk '{print $3}') || echo 'No application images to remove'
            cleanImg() {
              for img in $(
                sudo docker images --filter "reference=668874212870.dkr.ecr.us-east-1.amazonaws.com/$1:build-*" \
                  | awk '{ print $1":"$2 }' \
                  | tail -n +2
              ); do
                sudo docker rmi "$img" || echo "Failed to remove $img"
              done
            }
            cleanImg 'basex'
            cleanImg 'drone-build-java-17'
            cleanImg 'drone-cache'
            cleanImg 'drone-ecr-auth'
            sudo docker rmi $(sudo docker images -f 'dangling=true' -q) || echo 'No dangling images to remove'
            sudo docker system prune --volumes --force
            sudo docker network prune --force
            sudo docker volume prune --all --force

  - id: notify_success
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[prod_cron] Clean Drone Resources Success"
    htmlContent: "Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} succeeded."

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 * * 0"
    timezone: UTC
    disabled: true

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[prod_cron] Clean Drone Resources Failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
