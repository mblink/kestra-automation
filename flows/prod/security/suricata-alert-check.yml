id: suricata-alert-check
namespace: prod.security

description: |
  Fetch all Suricata alerts in the last 24 hours and send a grouped report for
  high-priority alerts. Runs on prodsalt.

  Uses a bare `salt <target> <module.function>` dispatch from the master, not
  salt-run — it doesn't touch the master's mtime_map cache the way salt-run does,
  so it doesn't need the ensure_salt_perms.sh ACL fix.

tasks:
  - id: check_alerts
    type: io.kestra.plugin.fs.ssh.Command
    host: prodsalt.bondlink.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - sudo salt prodsalt-arm cloudwatch_ips_alerts.get_suricata_alerts days=1

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 10 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[prod_cron] Suricata Alert Check Failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
