id: suricata-alert-check
namespace: prod.security

description: |
  Fetch all Suricata alerts in the last 24 hours and send a grouped report for
  high-priority alerts. Migrated from Rundeck job Prod/Security/SaltRun:
  Suricata Alert Check (0d0f8105). Source description note carried over: "Not
  actually salt-run, called from a module."

  Uses a bare `salt <target> <module.function>` dispatch from the master, not
  salt-run — it doesn't touch the master's mtime_map cache the way salt-run
  does, so it doesn't need the ensure_salt_perms.sh ACL fix (matching the
  source job, which never included it either). No <nodefilters> block at all;
  targets prodsalt as an assumption — confirm against the live Rundeck job's
  resolved node list before treating this as validated.

tasks:
  - id: check_alerts
    type: io.kestra.plugin.fs.ssh.Command
    host: prodsalt.bondlink.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - sudo salt prodsalt-arm cloudwatch_ips_alerts.get_suricata_alerts days=1

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 10 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Rundeck[prod_cron] Suricata Alert Check Failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
