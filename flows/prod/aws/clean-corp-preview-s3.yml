id: clean-corp-preview-s3
namespace: prod.aws

description: |
  Clean up builds of the corp preview site stored in S3. Migrated from Rundeck job Prod/AWS/Clean corp preview S3 (9b9b5ba7).

  Source job had no <nodefilters> block at all; targets prodsalt as an assumption, matching the same convention as other nodefilter-less salt-master jobs in this repo -- confirm against the live Rundeck job's resolved node list before treating this as validated.

  aws/clean_corp_preview.sh is a Namespace File
  (namespace-files/prod.aws/clean_corp_preview.sh in this repo, synced to
  Kestra's own prod.aws namespace), pulled in via
  {{ read('clean_corp_preview.sh') }} (no namespace= override needed — read()
  defaults to the calling flow's own namespace) rather than being inlined
  directly. This isn't about sharing across flows — it's the fix for a real
  production failure: the script's `${#keys[@]}` bash array-length syntax
  contains a literal `{#`, which Kestra's Pebble template engine parses as the
  start of a *Pebble* comment (`{# ... #}`); since bash never emits a matching
  `#}`, Pebble scans to end-of-file still inside the "comment" and throws
  `ParserException: Unclosed comment` at execution time. Escaping every
  `${#...}` occurrence is fragile and easy to reintroduce; read()'s return
  value is never re-parsed for template syntax, so this sidesteps the whole
  class of bug. Source of truth remains rundeck-jobs' aws/clean_corp_preview.sh.
  Source job called this with no args (live mode, not --dry-run).

tasks:
  - id: clean_corp_preview
    type: io.kestra.plugin.fs.ssh.Command
    host: prodsalt-arm.bondlink.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        cat > /tmp/clean_corp_preview.sh <<'CLEAN_CORP_PREVIEW_SCRIPT'
        {{ read('clean_corp_preview.sh') }}
        CLEAN_CORP_PREVIEW_SCRIPT
        chmod +x /tmp/clean_corp_preview.sh
        /tmp/clean_corp_preview.sh
        rm -f /tmp/clean_corp_preview.sh

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "15 23 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Rundeck[prod_cron] Corp preview cleanup failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
