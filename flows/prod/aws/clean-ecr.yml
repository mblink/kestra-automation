id: clean-ecr
namespace: prod.aws

description: |
  Clean up old ECR images. Runs on prodsalt.

  clean_ecr.sh is inlined below (quoted heredoc) rather than pulled from Namespace
  Files -- it's only used by this one flow. It takes no args, so it runs in live
  mode rather than --dry-run.

tasks:
  - id: clean_ecr
    type: io.kestra.plugin.fs.ssh.Command
    host: prodsalt.bondlink.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        cat > /tmp/clean_ecr.sh <<'CLEAN_ECR_SCRIPT'
        {{ read('clean_ecr.sh', namespace='prod.aws') }}
        CLEAN_ECR_SCRIPT
        chmod +x /tmp/clean_ecr.sh
        /tmp/clean_ecr.sh
        rm -f /tmp/clean_ecr.sh

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 23 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
      - matt@bondlink.com
    subject: "Kestra[prod_cron] Clean ECR failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
