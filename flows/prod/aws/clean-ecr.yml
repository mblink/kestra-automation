id: clean-ecr
namespace: prod.aws

description: |
  Clean up old ECR images. Migrated from Rundeck job Prod/AWS/Clean ECR (56e58b59).

  Source job had no <nodefilters> block at all; targets prodsalt as an assumption, matching the same convention as other nodefilter-less salt-master jobs in this repo -- confirm against the live Rundeck job's resolved node list before treating this as validated.

  aws/clean_ecr.sh is inlined below (quoted heredoc) rather than pulled from Namespace Files -- it's only used by this one flow. Source of truth remains rundeck-jobs' aws/clean_ecr.sh. Source job called this with no args (live mode, not --dry-run).

tasks:
  - id: clean_ecr
    type: io.kestra.plugin.fs.ssh.Command
    host: prodsalt.bondlink.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        cat > /tmp/clean_ecr.sh <<'CLEAN_ECR_SCRIPT'
        #!/usr/bin/env bash

        set -eo pipefail

        dryRun=0
        if [ "$1" = '--dry-run' ]; then
          dryRun=1
        fi

        log() {
          echo -e "[$(date +"%Y-%m-%dT%H:%M:%S")] $1"
        }

        regions=(us-east-1 us-east-2)

        appRepos=(
          bondlink-corporate-build
          bondlink-cron
          bondlink-drone-monitor
          bondlink-emma
          bondlink-ice
          bondlink-scala-scripts
          bondlink-stream-consumers
          bondlink-web
          bondlink-web-ssr
          bondlink-mariadb-mcp
          bondlink-hydra-headless-ts
        )

        droneRepos=(
          clamav-cvdupdate
          drone-build-java-21
          drone-build-java-25
          drone-cache
          drone-ecr-auth
          drone-oddjob
          drone-salt
          drone-scalatasks
        )

        branches=(
          RC
          develop
          banker-portal
          investor-portal
          issuer-portal
        )

        prefixWithSpaces() {
          while read -r s; do
            echo "$s" | sed -e 's/^/  /g'
          done
        }

        deleteInBatches() {
          region="$1"
          repo="$2"
          images="$3"

          # Chunk images into groups of 100, the AWS API only allows deleting 100 images at a time
          for batch in $(jq -c '_nwise(100) | select(length | . > 0)' <<< "$images"); do
            log "Deleting images in repo $repo:\n$(echo "$batch" | jq -c '.[]' | prefixWithSpaces)"

            if [ "$dryRun" = 0 ]; then
              res="$(
                /usr/local/bin/aws ecr batch-delete-image \
                  --region "$region" \
                  --repository-name "$repo" \
                  --image-ids "$batch"
              )"

              # The command above returns an exit code of 0 even when there were errors
              # so we need to check the response's failures key
              failures="$(jq '.failures | select(length | . > 0)' <<< "$res")"

              if [ ! -z "$failures" ]; then
                log "Failed to delete images:\n$(echo "$failures" | prefixWithSpaces)"
              fi
            fi
          done
        }

        imagesToKeep() {
          repo="$1"
          branch="$2"

          # Keep the last 20 RC images, the last 3 for other branches
          if [ "$branch" = 'RC' ]; then
            if [ "$repo" = 'bondlink-drone-monitor' ]; then
              echo 3
            else
              echo 20
            fi
          else
            echo 3
          fi
        }

        deleteUntaggedImages() {
          repos=("$@")

          for repo in "${repos[@]}"; do
            log "***************** Checking untagged images in ECR repo $repo in region $region"

            # Delete all images that don't have tags
            untaggedImageDigests="$(
              /usr/local/bin/aws ecr describe-images \
                --region "$region" \
                --repository-name "$repo" \
                --filter 'tagStatus=UNTAGGED' \
                --output json \
                | jq -c '.imageDetails | map({ "imageDigest": .imageDigest })'
            )"

            deleteInBatches "$region" "$repo" "$untaggedImageDigests"
          done
        }

        deleteBranchImages() {
          repos=("$@")

          for repo in "${repos[@]}"; do
            log "***************** Checking feature branch images in ECR repo $repo in region $region"

            allImages="$(
              /usr/local/bin/aws ecr describe-images \
                --region "$region" \
                --repository-name "$repo" \
                --output json \
                | jq -c '.imageDetails'
            )"

            for branch in "${branches[@]}"; do
              # Keep the last N images for the given branch, where N is dictated by imagesToKeep
              imagesToDelete="$(
                jq -c '
                  # Filter images to only those that match our tagging pattern
                  map(select((.imageTags // []) | map(select(test("^[0-9]{14}_'$branch'_[A-Za-z0-9]+$"))) | any))
                    # Sort images by their most recent tag
                    | sort_by(.imageTags | sort | .[-1])
                    # Drop the last N images
                    | .[:-'$(imagesToKeep "$repo" "$branch")']
                    # Map to just the image tags and flatten the array
                    | map(.imageTags)
                    | flatten
                    # Filter out null values
                    | map(select(.))
                    # Construct the shape that the AWS API wants
                    | map({ "imageTag": . })
                ' <<< "$allImages"
              )"

              deleteInBatches "$region" "$repo" "$imagesToDelete"
            done
          done
        }

        deleteAllButLatestImage() {
          repos=("$@")

          for repo in "${repos[@]}"; do
            log "***************** Check non-latest images in ECR repo $repo in region $region"

            allImages="$(
              /usr/local/bin/aws ecr describe-images \
                --region "$region" \
                --repository-name "$repo" \
                --output json \
                | jq -c '.imageDetails'
            )"

            imagesToDelete="$(
              jq -c '
                # Filter out images with latest tag
                map(select((.imageTags // []) | map(select(. == "latest")) | any | not))
                  # Map to just the image tags and flatten the array
                  | map(.imageTags)
                  | flatten
                  # Filter out null values
                  | map(select(.))
                  # Construct the shape that the AWS API wants
                  | map({ "imageTag": . })
              ' <<< "$allImages"
            )"

            deleteInBatches "$region" "$repo" "$imagesToDelete"
          done
        }

        for region in "${regions[@]}"; do
          deleteUntaggedImages "${appRepos[@]}"
          deleteBranchImages "${appRepos[@]}"

          deleteUntaggedImages "${droneRepos[@]}"
          deleteAllButLatestImage "${droneRepos[@]}"
        done
        CLEAN_ECR_SCRIPT
        chmod +x /tmp/clean_ecr.sh
        /tmp/clean_ecr.sh
        rm -f /tmp/clean_ecr.sh

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 23 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
      - matt@bondlink.com
    subject: "Kestra[prod_cron] Clean ECR failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
