id: clean-basex-backups
namespace: prod.aws

description: |
  Clean up BaseX backups stored in S3. Migrated from Rundeck job Prod/AWS/Clean BaseX backups (09625204).

  Source job had no <nodefilters> block at all; targets prodsalt as an assumption, matching the same convention as other nodefilter-less salt-master jobs in this repo -- confirm against the live Rundeck job's resolved node list before treating this as validated.

  Keeps the newest `IceGsm-` full per calendar month for older months and every full from the recent ones, under backups/basex in both s3://bondlink-data-east and its archive s3://bondlink-data-ohio. East holds only what the producer last wrote; the monthly history is in ohio, so a single-bucket run prunes the copy that has nothing to prune and leaves the archive untouched.

  The window runs from 2021-08 up to but excluding three months before now, so the four most recent months are always kept whole -- a month's extra fulls are deleted on the first run after it leaves the window, not while it is in it.

  `IceGsmUpdateLog-` keys match nothing here and no lifecycle rule expires them in either bucket, so they accumulate without bound. That is pre-existing and deliberate in this script; it needs its own decision.

  clean_basex_backups.sh is inlined below (quoted heredoc) rather than pulled from Namespace Files -- it's only used by this one flow, unlike syslogs.sh/bondlink_logs.py/ensure_salt_perms.sh which are genuinely shared across multiple flows. It is called with no args, so it runs live rather than --dry-run.

tasks:
  - id: clean_backups
    type: io.kestra.plugin.fs.ssh.Command
    host: prodsalt.bondlink.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        cat > /tmp/clean_basex_backups.sh <<'CLEAN_BASEX_SCRIPT'
        #!/usr/bin/env bash

        set -eo pipefail

        dryRun=0
        if [ "$1" = '--dry-run' ]; then
          dryRun=1
        fi

        log() {
          echo -e "[$(date +"%Y-%m-%dT%H:%M:%S")] $1"
        }

        startYear=2021
        startMonth=8

        function computeStartYearMonth() {
          # Ensure the start month has a leading zero if it's only one digit
          echo "$startYear-$(jq -r '"0\(.)"[-2:]' <<< "$startMonth")"
        }

        startYearMonth="$(computeStartYearMonth)"

        endYearMonth="$(
          jq -r '
            # Get current unix timestamp
            now
            # Convert it to array of elements, i.e. year, month, day, etc.
            | gmtime
            # Set the third array element (day) to 1 (the first day of the month)
            | .[2] = 1
            # Subtract 3 from the second array element (month) to get three months ago
            # It does not matter that this could result in a negative number, jq handles it gracefully
            | .[1] -= 3
            # Convert the array back to a unix timestamp
            | mktime
            # Print the year and month of the timestamp
            | strftime("%Y-%m")
          ' <<< '{}'
        )"

        yearMonthsToDelete=()

        while [ "$startYearMonth" != "$endYearMonth" ]; do
          yearMonthsToDelete+=("$startYearMonth")

          if [ "$startMonth" = 12 ]; then
            startYear=$((startYear + 1))
            startMonth=1
          else
            startMonth=$((startMonth + 1))
          fi

          startYearMonth="$(computeStartYearMonth)"
        done

        s3Prefix='backups/basex'
        keyRx='^'$s3Prefix'/IceGsm-(?<ym>[0-9]{4}-[0-9]{2})-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}\\.(zip|tar\\.br|tar\\.zst)$'

        # East holds what the producer last wrote; the monthly history lives in the ohio archive,
        # which nothing pruned while this was single-bucket. The listing is one merged .Contents
        # per bucket -- the CLI paginates list-objects-v2 itself, and both prefixes are well over
        # the 1000-key page size (east 12685, ohio 1512).
        windowMonths="$(printf '%s\n' "${yearMonthsToDelete[@]}" | wc -l | tr -d ' ')"

        for s3Bucket in bondlink-data-east bondlink-data-ohio; do
          log "*************** Bucket $s3Bucket"

          keysByYearMonth="$(
            /usr/local/bin/aws s3api list-objects-v2 --bucket "$s3Bucket" --prefix "$s3Prefix" \
              | jq -c '
                .Contents
                | map(.Key)
                | map(select(test("'$keyRx'")))
                # Reduce keys into an object keyed by `$year-$month`
                | reduce .[] as $x ({}; ($x | sub("'$keyRx'"; "\(.ym)")) as $ym | .[$ym] = ((.[$ym] // []) + [$x]))
              '
          )"

          # A run with nothing to delete used to print not one line, so an empty listing, a failed
          # listing and a healthy no-op were the same in the logs -- which is the whole of what a
          # reader gets to check. Counts come from jq rather than bash's array-length syntax: that
          # spelling opens with a brace-hash, which Pebble reads as the start of a comment and
          # which fails the flow at execution time, so it cannot appear in an ssh.Command block.
          matchedMonths="$(jq 'length' <<< "$keysByYearMonth")"
          matchedKeys="$(jq '[.[] | length] | add // 0' <<< "$keysByYearMonth")"
          deleteCount=0

          for yearMonth in "${yearMonthsToDelete[@]}"; do
            backupsToDelete="$(
              jq '
                # Get backups from the given year/month, force array if null
                (.["'$yearMonth'"] // [])
                # Sort them so the latest appear at the end
                | sort
                # Drop the last one (we keep the most recent backup from the year/month)
                | .[0:-1]
              ' <<< "$keysByYearMonth"
            )"

            if [ "$backupsToDelete" != '[]' ]; then
              deleteCount=$((deleteCount + $(jq 'length' <<< "$backupsToDelete")))
              log "*************** Deleting BaseX backups from $s3Bucket $yearMonth -- $backupsToDelete"

              apiJson="$(jq '{ "Objects": (. | map({ "Key": . })) }' <<< "$backupsToDelete")"

              if [ "$dryRun" = 0 ]; then
                res="$(/usr/local/bin/aws s3api delete-objects --bucket "$s3Bucket" --delete "$apiJson")"

                # The command above returns an exit code of 0 even when there were errors
                # so we need to check the response's errors key
                errors="$(jq '.Errors | select(length | . > 0)' <<< "$res")"

                if [ ! -z "$errors" ]; then
                  log "Failed to delete backups:\n$(echo "$errors")"
                  exit 1
                fi
              fi
            fi
          done

          log "Summary $s3Bucket: $matchedKeys IceGsm key(s) across $matchedMonths month(s), $windowMonths month(s) in the delete window, $deleteCount key(s) $([ "$dryRun" = 1 ] && echo 'that would be deleted' || echo 'deleted')"
        done
        CLEAN_BASEX_SCRIPT
        chmod +x /tmp/clean_basex_backups.sh
        /tmp/clean_basex_backups.sh
        rm -f /tmp/clean_basex_backups.sh

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 23 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
      - matt@bondlink.com
    subject: "Kestra[prod_cron] Clean BaseX backups failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].taskId }}
