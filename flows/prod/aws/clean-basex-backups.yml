id: clean-basex-backups
namespace: prod.aws

description: |
  Clean up BaseX backups stored in S3. Migrated from Rundeck job Prod/AWS/Clean BaseX backups (09625204).

  Source job had no <nodefilters> block at all; targets prodsalt as an assumption, matching the same convention as other nodefilter-less salt-master jobs in this repo -- confirm against the live Rundeck job's resolved node list before treating this as validated.

  Keeps the newest backup per calendar month for months older than three months, and everything from the last three months, under s3://bondlink-data-east/backups/basex. Only `IceGsm-` full backups are matched; `IceGsmUpdateLog-` keys are never pruned.

  clean_basex_backups.sh lives in namespace-files/prod.aws/ and is pulled in via {{ read('clean_basex_backups.sh') }}. It is called with no args, so it runs live rather than --dry-run.

tasks:
  - id: clean_backups
    type: io.kestra.plugin.fs.ssh.Command
    host: prodsalt.bondlink.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        cat > /tmp/clean_basex_backups.sh <<'CLEAN_BASEX_SCRIPT'
        {{ read('clean_basex_backups.sh') }}
        CLEAN_BASEX_SCRIPT
        chmod +x /tmp/clean_basex_backups.sh
        /tmp/clean_basex_backups.sh
        rm -f /tmp/clean_basex_backups.sh

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 23 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
      - matt@bondlink.com
    subject: "Kestra[prod_cron] Clean BaseX backups failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].taskId }}
