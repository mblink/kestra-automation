id: clean-production-db-backups
namespace: prod.aws

description: |
  Deletes backups based on a retention policy (weekly and monthly deletes after 2 years). Migrated from Rundeck job Prod/AWS/Clean Production DB backups (cb3aefd5).

  Source job had no <nodefilters> block at all; targets prodsalt as an assumption, matching the same convention as other nodefilter-less salt-master jobs in this repo -- confirm against the live Rundeck job's resolved node list before treating this as validated. Source job also had no explicit <timeZone> tag -- UTC assumed, matching this repo's general convention.

  aws/clean_database_backups.sh is inlined below (quoted heredoc) rather than pulled from Namespace Files -- it's only used by this one flow. Source of truth remains rundeck-jobs' aws/clean_database_backups.sh. Source job called this with no scriptargs, so it runs live (script treats any first arg other than --dryrun as live mode).

tasks:
  - id: clean_db_backups
    type: io.kestra.plugin.fs.ssh.Command
    host: prodsalt.bondlink.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        cat > /tmp/clean_database_backups.sh <<'CLEAN_DB_BACKUPS_SCRIPT'
        #!/bin/bash
        START_DAILY=$(date +'%Y-%m-%d')
        END_DAILY=$(date -d "${START_DAILY} - 365 days" +'%Y-%m-%d')
        START_WEEKLY=$(date -d "${START_DAILY} - 366 days" +'%Y-%m-%d')
        END_WEEKLY=$(date -d "${START_WEEKLY} - 1 years" +'%Y-%m-%d')
        START_MONTHLY=$(date -d "${END_WEEKLY} + 1 day" +'%Y-%m-%d')
        END_MONTHLY=$(date -d "now - 20 years" +'%Y-%m-%d')
        TO_DATE_REGEX="s:([0-9]{4})-([0-9]{2})-([0-9]{2})_([0-9]{2})-([0-9]{2})-([0-9]{2})/?:\1-\2-\3:"


        # bondlink-us-east-2 only has keys starting in 2-20-2024, a year from then, assuming nothing changes is when that key will need to be considered.
        # syncing them to a single namespace seems stupid.
        TOP_LEVEL_KEYS=("bondlink-us-east-2" "bondlink-us-west-2")
        TOP_LEVEL="s3://bondlink-data/backups/mysql/bondlink-us-west-2"
        MATCH_DAY="Sunday"
        STOP_DATE="${END_WEEKLY}"
        declare -a weekly
        declare -a monthly

        log() { echo -e "[$(date +"%Y-%m-%dT%H:%M:%S")] $1"; }

        weekly=("${START_WEEKLY}" "${END_WEEKLY}")
        monthly=("${START_MONTHLY}" "${END_MONTHLY}")
        log "Weekly ${weekly[@]}"
        log "Monthly ${monthly[@]}"

        SLEEP_TIME=1
        set -e

        if [ "$1" != "--dryrun" ]; then
          log "This script is running in live mode, sleeping ${SLEEP_TIME} seconds if you want to change your mind"
          sleep $SLEEP_TIME
          log "Waking up, you've been warned"
          DRYRUN=0
        else
          log "Running in dryrun mode"
          DRYRUN=1
        fi

        keyToDateS() { echo "$1" | sed 's:\.sql.*$::' |  sed -E "${TO_DATE_REGEX}"; }

        maybeDeleteBackup() {
          local checkType=$1; shift;
          local deleteKeys=("$@")
          if [ -z "${deleteKeys}" ]; then
            log "No keys to delete DRYRUN: ${DRYRUN}, StopDate: ${STOP_DATE} checkType: ${checkType}"
          else
            local totalKeys="${#deleteKeys[@]}"
            log "CheckType: ${checkType}. Total Keys: ${totalKeys}"
            for i in "${!deleteKeys[@]}"; do
              item="${deleteKeys[$i]}"
              asDateS=$(keyToDateS "${item}")
              if [[ "${item}" =~ "sql" ]]; then
                recursive=
              else
                recursive="--recursive "
              fi
              if [[ $DRYRUN -eq 1 || "${asDateS}" > "$STOP_DATE" ]]; then
                # log "*** Saving *** DryRun: $DRYRUN StopDate: $STOP_DATE - aws s3 rm ${recursive}s3://bondlink-data/mysql/backups/$item";
                continue
              else
                log "*** Deleting ${checkType} - $i/$totalKeys *** aws s3 rm ${recursive}s3://bondlink-data/backups/mysql/bondlink-us-west-2/$item"
                aws s3 rm ${recursive}s3://bondlink-data/backups/mysql/bondlink-us-west-2/$item --only-show-errors
              fi
            done;
          fi
        }

        declare -a deleteMonthlyDates
        declare -a deleteWeeklyDates
        declare -a saveDates
        declare -a afterStop
        for s3Key in $(aws s3 ls "${TOP_LEVEL}/" | grep "20" | awk '{ print $NF }'); do
          asDateS=$(keyToDateS "${s3Key}")
          if [[ ! -z "${STOP_DATE}" &&  "${asDateS}" > "${STOP_DATE}" ]]; then
            afterStop+=("$s3Key")
          elif [[ "${asDateS}" < "${weekly[0]}"  && "${asDateS}" > "${weekly[1]}" && "$(date -d "${asDateS}" +'%A')" != "$MATCH_DAY" ]]; then
            deleteWeeklyDates+=("${s3Key}")
          elif [[ "${asDateS}" < "${monthly[0]}"  && "${asDateS}" >  "${monthly[1]}" && "$(date -d ${asDateS} +'%d')" != "01" ]]; then
            deleteMonthlyDates+=("${s3Key}")
          else
            saveDates+=("${s3Key}")
          fi
        done
        log "Key stats"
        log "Past Stop Date: ${#afterStop[@]}"
        log "Weekly Deletes: ${#deleteWeeklyDates[@]}"
        log "Monthly Deletes: ${#deleteMonthlyDates[@]}"
        maybeDeleteBackup monthly "${deleteMonthlyDates[@]}"
        maybeDeleteBackup weekly "${deleteWeeklyDates[@]}"
        exit 0;
        CLEAN_DB_BACKUPS_SCRIPT
        chmod +x /tmp/clean_database_backups.sh
        /tmp/clean_database_backups.sh
        rm -f /tmp/clean_database_backups.sh

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 10 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Rundeck[prod_cron] Clean Production DB backups failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}

