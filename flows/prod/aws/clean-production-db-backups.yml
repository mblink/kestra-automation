id: clean-production-db-backups
namespace: prod.aws

description: |
  Deletes backups based on a retention policy (weekly and monthly deletes after 2 years). Migrated from Rundeck job Prod/AWS/Clean Production DB backups (cb3aefd5).

  Source job had no <nodefilters> block at all; targets prodsalt as an assumption, matching the same convention as other nodefilter-less salt-master jobs in this repo -- confirm against the live Rundeck job's resolved node list before treating this as validated. Source job also had no explicit <timeZone> tag -- UTC assumed, matching this repo's general convention.

  aws/clean_database_backups.sh is a Namespace File
  (namespace-files/prod.aws/clean_database_backups.sh in this repo, synced to
  Kestra's own prod.aws namespace), pulled in via
  {{ read('clean_database_backups.sh') }} (no namespace= override needed —
  read() defaults to the calling flow's own namespace) rather than being
  inlined directly. This isn't about sharing across flows — it's the fix for a
  real production failure (see clean-corp-preview-s3.yml, which hit the exact
  same bug): the script's `${#deleteKeys[@]}`-style bash array-length syntax
  contains a literal `{#`, which Kestra's Pebble template engine parses as the
  start of a *Pebble* comment (`{# ... #}`); since bash never emits a matching
  `#}`, Pebble scans to end-of-file still inside the "comment" and throws
  `ParserException: Unclosed comment` at execution time. Escaping every
  `${#...}` occurrence is fragile and easy to reintroduce; read()'s return
  value is never re-parsed for template syntax, so this sidesteps the whole
  class of bug. Source of truth remains rundeck-jobs' aws/clean_database_backups.sh.
  Source job called this with no scriptargs, so it runs live (script treats
  any first arg other than --dryrun as live mode).

tasks:
  - id: clean_db_backups
    type: io.kestra.plugin.fs.ssh.Command
    host: prodsalt.bondlink.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        cat > /tmp/clean_database_backups.sh <<'CLEAN_DB_BACKUPS_SCRIPT'
        {{ read('clean_database_backups.sh') }}
        CLEAN_DB_BACKUPS_SCRIPT
        chmod +x /tmp/clean_database_backups.sh
        /tmp/clean_database_backups.sh
        rm -f /tmp/clean_database_backups.sh

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 10 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Rundeck[prod_cron] Clean Production DB backups failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}

