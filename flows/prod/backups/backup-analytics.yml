id: backup-analytics
namespace: prod.backups

description: |
  Runs logical backup of the analytics server, replicated data plus locally
  written. Migrated from Rundeck job Prod/Backups/SaltRun: Backup Analytics
  (2fa843c9).

  Source job had no <nodefilters> block at all; since salt-run only runs on the
  Salt master, this flow targets prodsalt as an assumption — confirm against
  the live Rundeck job's resolved node list before treating this as validated.
  Source job also had no explicit <timeZone> tag — UTC assumed.

  Any flow that runs salt-run needs the salt-master ACL fix
  (getfacl/setfacl on /var/cache/salt/minion/roots/mtime_map) run first, or the
  command fails with a permissions error. That's namespace-files/shared/
  ensure_salt_perms.sh, pulled in via
  {{ read('ensure_salt_perms.sh', namespace='shared') }} instead of being
  duplicated inline — shared with every other salt-run flow in this repo.

tasks:
  - id: run_backup
    type: io.kestra.plugin.fs.ssh.Command
    host: prodsalt.bondlink.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        cat > /tmp/ensure_salt_perms.sh <<'ENSURE_SALT_PERMS_SCRIPT'
        {{ read('ensure_salt_perms.sh', namespace='shared') }}
        ENSURE_SALT_PERMS_SCRIPT
        chmod +x /tmp/ensure_salt_perms.sh
        /tmp/ensure_salt_perms.sh
        rm -f /tmp/ensure_salt_perms.sh
        sudo salt-run -l error backups.analytics destination=s3 --out=json | jq -re 'select(.success == true)'

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "2 0 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Rundeck[prod_cron] Backup Analytics failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
