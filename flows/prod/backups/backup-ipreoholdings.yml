id: backup-ipreoholdings
namespace: prod.backups

description: |
  Mariadb-dump backup of the IpreoHoldings database. Migrated from Rundeck job
  Prod/Backups/SaltRun: Backup IpreoHoldings (97775e81).

  Despite the "SaltRun" name this uses a bare `salt <target> <module.function>`
  dispatch from the master, not salt-run — it doesn't touch the master's
  mtime_map cache the way salt-run does, so it doesn't need the
  ensure_salt_perms.sh ACL fix (matching the source job, which never included
  it either). No <nodefilters> block at all; targets prodsalt as an
  assumption — confirm against the live Rundeck job's resolved node list
  before treating this as validated. Source job also had no <notification>
  block — see errors: below for the (newly added, this repo's convention)
  failure notification.

tasks:
  - id: run_backup
    type: io.kestra.plugin.fs.ssh.Command
    host: prodsalt.bondlink.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        sudo salt proddbanalytics mariadb_backup.single_backup IpreoHoldings --out=json | jq '.[] | select(.success == true) // halt_error(1)'

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Rundeck[prod_cron] Backup IpreoHoldings failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
