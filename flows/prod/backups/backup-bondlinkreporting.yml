id: backup-bondlinkreporting
namespace: prod.backups

description: |
  Mariadb-dump backup of the BondLinkReporting database, sync'd to S3. Runs on
  prodsalt.

  Uses a bare `salt <target> <module.function>` dispatch from the master, not
  salt-run — it doesn't touch the master's mtime_map cache the way salt-run does,
  so it doesn't need the ensure_salt_perms.sh ACL fix.

tasks:
  - id: run_backup
    type: io.kestra.plugin.fs.ssh.Command
    host: prodsalt.bondlink.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        output=$(sudo salt proddbanalytics mariadb_backup.single_backup BondLinkReporting --out=json)
        echo "$output" | jq -e '.[] | select(.success == true)'

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 6 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[prod_cron] Backups BondLinkReporting failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
