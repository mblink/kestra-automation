id: wazuh-logs
namespace: prod.backups

description: |
  Backup all wazuh alert logs. Replaces the hand-installed crontab on the wazuh manager that syncs
  the same tree to s3://bondlink-data/ossec-logs/prod/ daily at 00:00 UTC — that crontab exists in
  no repo, and removing it is part of retiring bondlink-data. Migrated from Rundeck job
  Prod/Backups/Wazuh Logs (ea73e810). See bondlink-logs.yml for the discover_*_hosts task shape and
  its AwsCLI/IMDS prerequisite notes (already confirmed satisfied on prodsalt-arm, the host Kestra
  runs on).

  Discovery is narrowed to DeployStatus=active, not to NodeType=wazuh-docker alone. Both prodops02
  and prodops03 carry that NodeType, but only prodops02 runs the wazuh manager (pillar/prod/servers
  gives it wazuh_roles server+dashboard, prodops03 indexer only), so it is the only host holding
  alerts. Fanning out to both would fail the sync on prodops03, and two managers writing one prefix
  would overwrite each other's keys.

  The alerts are NOT at /var/ossec/logs/alerts on the host — that path does not exist there. The
  manager runs in Docker against the named volume multi-node_master-wazuh-logs, mounted at
  /var/ossec/logs inside the container. The task resolves the host-side mountpoint with
  docker volume inspect rather than hardcoding /var/lib/docker/volumes/..., which embeds the
  compose project name, and fails loudly if the directory is missing rather than syncing nothing.

tasks:
  - id: discover_monitor_hosts
    type: io.kestra.plugin.aws.cli.AwsCLI
    outputFiles:
      - instances.json
    commands:
      - |
        aws ec2 describe-instances \
          --filters "Name=tag:Environment,Values=prod" "Name=tag:NodeType,Values=wazuh-docker" "Name=tag:DeployStatus,Values=active" "Name=instance-state-name,Values=running" \
          --query "Reservations[].Instances[].{Name: Tags[?Key=='Name']|[0].Value, PrivateDnsName: NetworkInterfaces[0].PrivateDnsName}" \
          --output json > instances.json

  - id: backup_per_host
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ fromJson(read(outputs.discover_monitor_hosts.outputFiles['instances.json'])) }}"
    concurrencyLimit: 3
    tasks:
      - id: sync_logs
        type: io.kestra.plugin.fs.ssh.Command
        host: "{{ fromJson(taskrun.value).PrivateDnsName }}"
        port: "2007"
        username: bldeploy
        authMethod: PUBLIC_KEY
        privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
        strictHostKeyChecking: "no"
        commands:
          - |
            set -e
            echo "Backing up wazuh logs for {{ fromJson(taskrun.value).Name }} ({{ fromJson(taskrun.value).PrivateDnsName }})"
            cat > /tmp/wazuh_alerts_sync.sh <<'WAZUH_ALERTS_SCRIPT'
            {{ read('wazuh_alerts_sync.sh') }}
            WAZUH_ALERTS_SCRIPT
            chmod +x /tmp/wazuh_alerts_sync.sh
            /tmp/wazuh_alerts_sync.sh
            rm -f /tmp/wazuh_alerts_sync.sh

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 0 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[prod_cron] Wazuh Logs failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].taskId }}
