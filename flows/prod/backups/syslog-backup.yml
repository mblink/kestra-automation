id: syslog-backup
namespace: prod.backups

description: |
  Backup all /var/log/*.gz to S3. Migrated from Rundeck job Prod/Backups/Syslog
  Backup (f0d8e36d) — still executionEnabled/scheduleEnabled in the Rundeck source
  (filed under Prod/old_jobs in the rundeck-jobs export, but that's just an export
  organization artifact, not deprecation) — targets tags:prod, dispatch strategy
  parallel/keepgoing=true, threadcount 3.

  Target hosts are discovered dynamically via AWS instance tags (Environment=prod,
  running), same approach as staging.backups' syslog-backup.yml — see that flow and
  bondlink-logs.yml for the discover_*_hosts task shape and its AwsCLI/IMDS
  prerequisite notes (confirmed satisfied on prodsalt-arm, the host Kestra runs on).
  Kestra's ForEach doesn't stop other iterations when one fails unless told to, so
  no per-host error handling is needed to preserve dispatch.keepgoing=true's
  behavior. concurrencyLimit is capped at 3, matching the source job's threadcount.

  logs/syslogs.sh is a Namespace File (namespace-files/shared/syslogs.sh in this
  repo, synced to Kestra's `shared` namespace), pulled in via
  {{ read('syslogs.sh', namespace='shared') }} — the exact same script backs up
  both staging.backups and this flow, so a script change only needs a single
  namespace-files edit rather than duplicating it per environment. Source of truth
  remains rundeck-jobs' logs/syslogs.sh.

tasks:
  - id: discover_prod_hosts
    type: io.kestra.plugin.aws.cli.AwsCLI
    outputFiles:
      - instances.json
    commands:
      - |
        aws ec2 describe-instances \
          --filters "Name=tag:Environment,Values=prod" "Name=instance-state-name,Values=running" \
          --query "Reservations[].Instances[].{Name: Tags[?Key=='Name']|[0].Value, PrivateDnsName: NetworkInterfaces[0].PrivateDnsName}" \
          --output json > instances.json

  - id: backup_per_host
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ fromJson(read(outputs.discover_prod_hosts.outputFiles['instances.json'])) }}"
    concurrencyLimit: 3
    tasks:
      - id: backup
        type: io.kestra.plugin.fs.ssh.Command
        host: "{{ fromJson(taskrun.value).PrivateDnsName }}"
        port: "2007"
        username: bldeploy
        authMethod: PUBLIC_KEY
        privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
        strictHostKeyChecking: "no"
        commands:
          - |
            set -e
            echo "Backing up syslogs for {{ fromJson(taskrun.value).Name }} ({{ fromJson(taskrun.value).PrivateDnsName }})"
            cat > /tmp/syslogs.sh <<'SYSLOG_SCRIPT'
            {{ read('syslogs.sh', namespace='shared') }}
            SYSLOG_SCRIPT
            chmod +x /tmp/syslogs.sh
            sudo /tmp/syslogs.sh
            rm -f /tmp/syslogs.sh

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 12 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Rundeck[prod_cron] Syslog Backup failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
