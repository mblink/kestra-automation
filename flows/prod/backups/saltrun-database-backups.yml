id: saltrun-database-backups
namespace: prod.backups

description: |
  Production database backups, sync'd to S3.
  Migrated from Rundeck job Prod/Backups/SaltRun: Database Backups (073b9e06).

  NOTE: the source Rundeck job had no <nodefilters> block at all (unusual — most jobs
  specify an explicit target). Since salt-run only runs on the Salt master, this flow
  targets prodsalt as an assumption — confirm against the live Rundeck job's resolved
  node list before treating this as validated.

  Any flow that runs salt-run/salt-call needs the salt-master ACL fix
  (getfacl/setfacl on /var/cache/salt/minion/roots/mtime_map) run first, or the
  command fails with a permissions error. That's namespace-files/shared/
  ensure_salt_perms.sh here, pulled in via
  {{ read('ensure_salt_perms.sh', namespace='shared') }} the same way syslogs.sh
  and bondlink_logs.py are shared — see prod.backups' bondlink-logs.yml for that
  pattern's own notes. (A prior `namespaceFiles: include: [ensure_salt_perms.sh]`
  on this task never actually got referenced from commands, and namespaceFiles on
  an ssh.Command task only stages files into the Kestra worker's own local working
  directory anyway — it doesn't upload them to the remote SSH host, so it couldn't
  have worked here regardless. Removed in favor of the read()-into-heredoc pattern,
  which does work since it's rendered into the command text before it's sent over
  SSH.)

  Mail is sent via SendGrid's HTTPS API directly (io.kestra.plugin.notifications.
  sendgrid.SendGridMailSend, using the real SendGrid Java SDK — confirmed present in
  the running image by inspecting the jar's bytecode, since Kestra's own docs page
  for this task has two inaccuracies: it names the type io.kestra.plugin.twilio.
  sendgrid.SendGridMailSend (wrong package) and its example uses htmlTextContent
  (that's the *other* MailSend task's field name — this one is htmlContent). No SMTP
  host/port/mail-domain/TLS settings needed at all — just sendgridApiKey, referenced
  as the SENDGRID_API_KEY secret. This supersedes the earlier mail.bondlink.vpc SMTP
  relay design entirely, per salt/kestra's kestra-postfix-auth state now writing only
  the SendGrid API key to /var/lib/kestra/.postfix-auth (no smtp-host/smtp-port).

tasks:
  - id: run_backup
    type: io.kestra.plugin.fs.ssh.Command
    host: prodsalt.bondlink.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        cat > /tmp/ensure_salt_perms.sh <<'ENSURE_SALT_PERMS_SCRIPT'
        {{ read('ensure_salt_perms.sh', namespace='shared') }}
        ENSURE_SALT_PERMS_SCRIPT
        chmod +x /tmp/ensure_salt_perms.sh
        /tmp/ensure_salt_perms.sh
        rm -f /tmp/ensure_salt_perms.sh
        sudo salt-run backups.replica server=proddb03 destination=s3 --out=json | jq -re 'select(.success == true)'

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 7 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Rundeck[prod_cron] Backup Failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
