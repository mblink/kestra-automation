id: bondlink-logs
namespace: prod.backups

description: |
  Backup everything matching /var/log/bondlink/*.gz to S3. Migrated from Rundeck job
  Prod/Backups/BondLink Logs (f08c430a).

  Target hosts are now discovered dynamically via AWS instance tags
  (Environment=prod, BondLinkApp=true, running) instead of a hardcoded list —
  this supersedes the prior GAP note about the Rundeck source job's tag filter
  ("tags:web, tags:corporate, tags:docker, tags:partner, tags:cron") only
  resolving "web" against the fetched inventory. BondLinkApp=true is the tag that
  actually captures every host running some part of the BondLink app stack (web,
  jobs, ice/BaseX, salt master, jump, dev/build boxes), matching the Rundeck job's
  original broad intent; the backup script itself no-ops cleanly on any host with
  no /var/log/bondlink/*.gz files, so over-including a host here is harmless.

  logs/bondlink_logs.py is inlined below (quoted heredoc) rather than pulled from
  Namespace Files — same convention as the rest of this repo. Source of truth
  remains rundeck-jobs' logs/bondlink_logs.py. Note it imports `more_itertools` and
  `boto3` — confirm those are available in the target host's python3 environment.

  PREREQUISITE (confirmed satisfied on prodsalt-arm, the host Kestra itself runs
  on): discover_bondlink_hosts relies on prodsalt-arm's EC2 instance role for AWS
  credentials (no injected keys) — AwsCLI runs its `aws` call in a sibling Docker
  container, one network hop past the Kestra container's own IMDS access, so IMDSv2
  needs a hop limit >= 2 or credential/region resolution silently fails. Verified:
  prodsalt-arm's IamInstanceProfile is ProdMonitor, which has the AWS-managed
  ReadOnlyAccess policy attached (covers ec2:DescribeInstances), and its
  MetadataOptions are already HttpPutResponseHopLimit=3 / HttpTokens=required. No
  infra change needed for this flow to work.

tasks:
  - id: discover_bondlink_hosts
    type: io.kestra.plugin.aws.cli.AwsCLI
    outputFiles:
      - instances.json
    commands:
      - |
        aws ec2 describe-instances \
          --filters "Name=tag:Environment,Values=prod" "Name=tag:BondLinkApp,Values=true" "Name=instance-state-name,Values=running" \
          --query "Reservations[].Instances[].NetworkInterfaces[].PrivateDnsName | []" \
          --output json > instances.json

  - id: backup_per_host
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ fromJson(read(outputs.discover_bondlink_hosts.outputFiles['instances.json'])) }}"
    concurrencyLimit: 3
    tasks:
      - id: backup
        type: io.kestra.plugin.fs.ssh.Command
        host: "{{ taskrun.value }}"
        port: "2007"
        username: bldeploy
        authMethod: PUBLIC_KEY
        privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
        strictHostKeyChecking: "no"
        commands:
          - |
            set -e
            cat > /tmp/bondlink_logs.py <<'BONDLINK_LOGS_SCRIPT'
            #!/usr/bin/env python3
            import glob
            import os
            from typing import List, Tuple
            import boto3, botocore
            import socket
            from more_itertools import partition
            from dataclasses import dataclass

            ROOT_DIR = '/var/log/bondlink'
            BUCKET = 'bondlink-data'
            HOSTNAME = socket.gethostname()
            ENV = "prod" if "prod" in HOSTNAME else "staging"
            DEBUG = False

            @dataclass
            class LogKey:
              log: str
              key: str

            def is_crap_log(x: str) -> bool:
              return 'apache-aws.log' in x

            # Get all of our log files, ignoring, for now, a single pattern of the apache-aws
            # log that is generated by underlying Java libraries
            def base_logs() -> Tuple[List[str],List[str]]:
              return list(map(list, partition(is_crap_log, glob.glob("*.gz", root_dir=ROOT_DIR))))

            # eah LogKey should represent a LogKey.key that does not exist, but not required.
            def perform_backups(copy_logs:List[LogKey], s3: boto3.client):
              for log in copy_logs:
                try:
                  print(f"Copying {log.log} to {log.key}")
                  with open(f'{ROOT_DIR}/{log.log}', 'rb') as fb:
                    s3.put_object(Bucket=BUCKET, Body=fb, Key=log.key)
                except Exception as e:
                  print(f"Failed to copy {BUCKET}, Bytes={ROOT_DIR}/{log.log}, Key={log.key}, Exception: {e}")

            # Collect logs that are on the file system, but missing from s3
            def backup_logs(s3:boto3.client, logs: List[str]) -> List[LogKey]:
              copy_logs = []
              if len(logs):
                print(f"Log Files to Check {len(logs)}")

              for log in logs:
                #typical format bondlink-debug.log.2023-10-21.gz
                fldr = '-'.join(log.split('.')[-2].split('-')[0:2])
                key = f'weblogs/{ENV}/{HOSTNAME}/{fldr}/{log}'
                if DEBUG:
                  print(f'{BUCKET}/{key}')

                #if the key doesn't exist we add it to be copied
                try:
                  s3.head_object(Bucket=BUCKET,Key=key)
                except botocore.exceptions.ClientError as ce:
                  if "404" in str(ce):
                    copy_logs.append(LogKey(log, key))
                  else:
                    print(f"Non 404 Exception Bucket: {BUCKET} Key: {key}")

              print(f"Log files to update {len(copy_logs)}")

              return copy_logs

            # This is mostly for aws-apache.log to stop sucking up space
            def cleanup(logs):
              for f in logs:
                print(f"Removing {ROOT_DIR}/{f}")
                os.unlink(f'{ROOT_DIR}/{f}')

            if __name__ == '__main__':
              s3 = boto3.client('s3')
              bondlink_logs, crap_logs = base_logs()
              if len(bondlink_logs):
                perform_backups(backup_logs(s3, bondlink_logs), s3)
              else:
                print("No logs to update")

              cleanup(crap_logs)
            BONDLINK_LOGS_SCRIPT
            python3 /tmp/bondlink_logs.py
            rm -f /tmp/bondlink_logs.py

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "15 7 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[prod_cron] BondLink Logs failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
