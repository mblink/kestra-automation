id: backup-binary-logs
namespace: prod.backups

description: |
  Back up binary logs of cluster nodes.

  Target hosts are discovered dynamically via AWS instance tags
  (Environment=prod, NodeType=cluster-node, running), so whatever is tagged as a
  cluster node gets backed up. See bondlink-logs.yml for the discover_*_hosts
  task shape and its AwsCLI/IMDS prerequisite notes (already confirmed satisfied
  on prodsalt-arm, the host Kestra runs on).

  Mail is sent via SendGrid's HTTPS API directly (io.kestra.plugin.notifications.
  sendgrid.SendGridMailSend, using the real SendGrid Java SDK — confirmed present in
  the running image by inspecting the jar's bytecode, since Kestra's own docs page
  for this task has two inaccuracies: it names the type io.kestra.plugin.twilio.
  sendgrid.SendGridMailSend (wrong package) and its example uses htmlTextContent
  (that's the *other* MailSend task's field name — this one is htmlContent). No SMTP
  host/port/mail-domain/TLS settings needed at all — just sendgridApiKey, referenced
  as the SENDGRID_API_KEY secret. This supersedes the earlier mail.bondlink.vpc SMTP
  relay design entirely, per salt/kestra's kestra-postfix-auth state now writing only
  the SendGrid API key to /var/lib/kestra/.postfix-auth (no smtp-host/smtp-port).

  binlog_backups.sh is inlined below (quoted heredoc) rather than pulled from
  Namespace Files — it's only used by this one flow.

tasks:
  - id: discover_db_hosts
    type: io.kestra.plugin.aws.cli.AwsCLI
    outputFiles:
      - instances.json
    commands:
      - |
        aws ec2 describe-instances \
          --filters "Name=tag:Environment,Values=prod" "Name=tag:NodeType,Values=cluster-node" "Name=instance-state-name,Values=running" \
          --query "Reservations[].Instances[].{Name: Tags[?Key=='Name']|[0].Value, PrivateDnsName: NetworkInterfaces[0].PrivateDnsName}" \
          --output json > instances.json

  - id: backup_per_host
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ fromJson(read(outputs.discover_db_hosts.outputFiles['instances.json'])) }}"
    concurrencyLimit: 3
    tasks:
      - id: backup
        type: io.kestra.plugin.fs.ssh.Command
        host: "{{ fromJson(taskrun.value).PrivateDnsName }}"
        port: "2007"
        username: bldeploy
        authMethod: PUBLIC_KEY
        privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
        strictHostKeyChecking: "no"
        commands:
          - |
            set -e
            echo "Backing up binary logs for {{ fromJson(taskrun.value).Name }} ({{ fromJson(taskrun.value).PrivateDnsName }})"
            cat > /tmp/binlog_backups.sh <<'BINLOG_SCRIPT'
            #!/usr/bin/env bash
            CURRENT=$(sudo mariadb -e "show master status" | grep -v File | cut -f 1)
            sudo /usr/local/bin/aws s3 sync /var/log/mysql/ s3://bondlink-data-east/backups/mysql/binlogs/$HOSTNAME/ --exclude="*" --include="*bin*" --exclude="*index*" --exclude="${CURRENT}" --only-show-errors
            BINLOG_SCRIPT
            chmod +x /tmp/binlog_backups.sh
            sudo /tmp/binlog_backups.sh
            rm -f /tmp/binlog_backups.sh

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */12 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[prod_cron] Backup Binary Logs failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
