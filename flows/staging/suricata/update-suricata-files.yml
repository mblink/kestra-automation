id: update-suricata-files
namespace: staging.suricata

description: |
  Download new Suricata rule definitions to the salt master and push them to each
  suricata server. Migrated from Rundeck job Staging/Suricata/Update Suricata Files
  (8d3bb190). Targets tags:monitor, which resolves to stagingsalt only in the fetched
  staging.xml inventory.

  Unlike Prod's equivalent suricata-update-rules job (which pulls suricata/update-
  rules.sh from this repo's SCM path), this job's scriptfile is a bare
  /usr/local/bin/update-rules.sh — already installed on the host outside version
  control, not tracked in this repo — so it's a plain exec, no inlining possible.

tasks:
  - id: run_update
    type: io.kestra.plugin.fs.ssh.Command
    host: stagingsalt.staging.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - /usr/local/bin/update-rules.sh

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */12 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[staging_cron] Update Suricata Files failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
