id: drift-check
namespace: staging.infra

description: |
  Nightly plan of every staging server-group directory with a non-empty `servers:` block, via
  namespace-files/shared/tofu_drift_check.py, then a human-gated apply of the groups you pick.
  See flows/staging/infra/drift_check.md for background.

  When any group drifts, notify_result emails the per-group changes and the execution pauses at
  await_review. Resuming asks for groups_to_apply, a multi-select of this run's drifted groups
  that defaults to none: resuming with nothing selected applies nothing. apply_selected applies
  each chosen group's saved plan from this run (tofu rejects a plan the state has moved past),
  keeps going past a failed group, and fails the task if any did. staging/db-prod-test and
  staging/ops set use_lockfile = true, which no role can write, so their applies fail on the lock.

  Plans live under /tmp/tofu-plans/run-<execution id>/ on the worker; cleanup_plans (finally:)
  removes them whether the run succeeds, fails or is killed.

  TF_VAR_aws_creation_key/TF_VAR_user_ssh_key are fetched directly from Secrets Manager
  (staging/kestra-worker/tf-aws-creation-key, staging/kestra-worker/tf-user-ssh-key) using
  StagingKestraWorker's own IMDS-derived credentials, not Kestra's secret() store -- decryption
  is gated by this role's own IAM+KMS grant (global/secretsmanager/kms.tf in /src/infrastructure,
  alias/staging-kestra-worker-secrets), not by who can read Kestra's secret store or flow logs.
  /src/infrastructure's provider.tf hardcodes named profiles (default/east/ohio/oregon), which
  don't exist in bldeploy's environment, so each tofu task points AWS_CONFIG_FILE at
  namespace-files/shared/aws_instance_role_profiles.ini: those names with regions and no
  credentials, so the SDK falls through to StagingKestraWorker's instance role.

concurrency:
  limit: 1
  behavior: FAIL

tasks:
  - id: get_target_host
    type: io.kestra.plugin.aws.cli.AwsCLI
    outputFiles:
      - host.txt
    commands:
      - |
        set -eo pipefail
        cat > /tmp/aws_query.sh <<'AWS_QUERY_SCRIPT'
        {{ read('aws_query.sh', namespace='shared') }}
        AWS_QUERY_SCRIPT
        chmod +x /tmp/aws_query.sh
        /tmp/aws_query.sh environmentKestraWorker staging | tr -d '\n' > host.txt
        rm -f /tmp/aws_query.sh

  - id: drift_check
    type: io.kestra.plugin.fs.ssh.Command
    host: "{{ read(outputs.get_target_host.outputFiles['host.txt']) }}"
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        export PATH="/usr/local/bin:$PATH"
        TF_VAR_aws_creation_key=$(/usr/local/bin/aws secretsmanager get-secret-value --region us-east-1 --secret-id staging/kestra-worker/tf-aws-creation-key --query SecretString --output text)
        TF_VAR_user_ssh_key=$(/usr/local/bin/aws secretsmanager get-secret-value --region us-east-1 --secret-id staging/kestra-worker/tf-user-ssh-key --query SecretString --output text)
        export TF_VAR_aws_creation_key TF_VAR_user_ssh_key
        cat > /tmp/kestra_aws_config <<'AWS_CONFIG'
        {{ read('aws_instance_role_profiles.ini', namespace='shared') }}
        AWS_CONFIG
        export AWS_CONFIG_FILE=/tmp/kestra_aws_config
        export AWS_PROFILE=east
        cd /src/infrastructure
        git pull
        cat > /tmp/tofu_drift_check.py <<'DRIFT_SCRIPT'
        {{ read('tofu_drift_check.py', namespace='shared') }}
        DRIFT_SCRIPT
        chmod +x /tmp/tofu_drift_check.py
        /opt/saltstack/salt/bin/python3 /tmp/tofu_drift_check.py \
          --env staging --root /src/infrastructure \
          --plan-dir /tmp/tofu-plans/run-{{ execution.id }} --kestra-outputs
        rm -f /tmp/tofu_drift_check.py

  - id: review_if_drifted
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.drift_check.vars.drifted_groups | length > 0 }}"
    then:
      - id: notify_result
        type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
        sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
        from: kestra@bondlink.com
        to:
          - jeff@bondlink.com
        subject: "Kestra[staging_cron] Drift Check Report"
        htmlContent: |
          <p>infrastructure at <code>{{ outputs.drift_check.vars.infra_commit }}</code>. Full diffs are in the drift_check task log; resume and pick the groups to apply:
          <a href="https://kestra.prod.bondlink.org/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}">{{ execution.id }}</a></p>
          <pre>{{ outputs.drift_check.vars.summary }}</pre>

      - id: await_review
        type: io.kestra.plugin.core.flow.Pause
        description: Review drift_check's log, then resume and select the groups to apply -- none are applied unless selected.
        onResume:
          - id: groups_to_apply
            type: MULTISELECT
            expression: "{{ outputs.drift_check.vars.drifted_groups }}"
            required: false
            description: Drifted groups whose saved plan from this run should be applied. Leave empty to apply nothing.

      - id: apply_if_selected
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.await_review.onResume.groups_to_apply | default([]) | length > 0 }}"
        then:
          - id: apply_selected
            type: io.kestra.plugin.fs.ssh.Command
            host: "{{ read(outputs.get_target_host.outputFiles['host.txt']) }}"
            port: "2007"
            username: bldeploy
            authMethod: PUBLIC_KEY
            privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
            strictHostKeyChecking: "no"
            commands:
              - |
                set -e
                export PATH="/usr/local/bin:$PATH"
                cat > /tmp/kestra_aws_config <<'AWS_CONFIG'
                {{ read('aws_instance_role_profiles.ini', namespace='shared') }}
                AWS_CONFIG
                export AWS_CONFIG_FILE=/tmp/kestra_aws_config
                export AWS_PROFILE=east
                selection=/tmp/tofu-plans/run-{{ execution.id }}/selection
                cat > "$selection.json" <<'SELECTION_JSON'
                {"groups":
                {{ outputs.await_review.onResume.groups_to_apply | toJson }}
                , "plans":
                {{ outputs.drift_check.vars.plans | toJson }}
                }
                SELECTION_JSON
                /opt/saltstack/salt/bin/python3 -c 'import json, sys; s = json.load(open(sys.argv[1])); print("\n".join(g + " " + (s["plans"].get(g) or "") for g in s["groups"]))' "$selection.json" > "$selection.txt"
                applied=""
                failed=""
                while read -r group plan; do
                  if [ -z "$plan" ]; then
                    echo "[$group] no saved plan from this run; not applied"
                    failed="$failed $group"
                  elif (cd "/src/infrastructure/staging/$group" && tofu apply -input=false -no-color "$plan" < /dev/null); then
                    applied="$applied $group"
                  else
                    echo "[$group] apply failed"
                    failed="$failed $group"
                  fi
                done < "$selection.txt"
                /opt/saltstack/salt/bin/python3 -c 'import json, sys; print("::" + json.dumps(dict(outputs=dict(applied=sys.argv[1].split(), failed=sys.argv[2].split()))) + "::")' "$applied" "$failed"
                [ -z "$failed" ]

          - id: notify_applied
            type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
            sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
            from: kestra@bondlink.com
            to:
              - jeff@bondlink.com
            subject: "Kestra[staging_cron] Drift Apply Succeeded"
            htmlContent: |
              <p>Applied {{ outputs.apply_selected.vars.applied | join(', ') }} at infrastructure <code>{{ outputs.drift_check.vars.infra_commit }}</code>. Apply logs are in the apply_selected task log.</p>
              <pre>{{ outputs.drift_check.vars.summary }}</pre>

    else:
      - id: notify_clean
        type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
        sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
        from: kestra@bondlink.com
        to:
          - jeff@bondlink.com
        subject: "Kestra[staging_cron] Drift Check Report: No Drift"
        htmlContent: |
          <p>infrastructure at <code>{{ outputs.drift_check.vars.infra_commit }}</code>; nothing drifted.</p>
          <pre>{{ outputs.drift_check.vars.summary }}</pre>

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"
    timezone: UTC
    disabled: true

finally:
  - id: cleanup_plans
    type: io.kestra.plugin.fs.ssh.Command
    host: "{{ read(outputs.get_target_host.outputFiles['host.txt']) }}"
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        cat > /tmp/tofu_plan_cleanup.sh <<'CLEANUP_SCRIPT'
        {{ read('tofu_plan_cleanup.sh', namespace='shared') }}
        CLEANUP_SCRIPT
        chmod +x /tmp/tofu_plan_cleanup.sh
        /tmp/tofu_plan_cleanup.sh {{ execution.id }}
        rm -f /tmp/tofu_plan_cleanup.sh

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[staging_cron] Drift Check Failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].taskId }}
