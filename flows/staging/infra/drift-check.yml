id: drift-check
namespace: staging.infra

description: |
  Nightly plan-only sweep of every staging server-group directory with a non-empty
  `servers:` block, via namespace-files/shared/tofu_drift_check.py. Reports clean/drift/error
  per group; never applies. See flows/staging/infra/drift_check.md for background and the
  still-open question of how a follow-up "apply what drifted" flow should work.

  Pause has no onResume inputs (a bare Pause, matching the one existing precedent in
  shared.infra/provision-server.yml): there's no decision to gate yet, since apply isn't wired
  up here. The continue-after-resume step re-runs the same plan rather than doing nothing, so
  resuming has a visible, safe effect.

  TF_VAR_aws_creation_key/TF_VAR_user_ssh_key are fetched directly from Secrets Manager
  (staging/kestra-worker/tf-aws-creation-key, staging/kestra-worker/tf-user-ssh-key) using
  StagingKestraWorker's own IMDS-derived credentials, not Kestra's secret() store -- decryption
  is gated by this role's own IAM+KMS grant (global/secretsmanager/kms.tf in /src/infrastructure,
  alias/staging-kestra-worker-secrets), not by who can read Kestra's secret store or flow logs.
  /src/infrastructure's provider.tf hardcodes named profiles (default/east/ohio/oregon), which
  don't exist in bldeploy's environment, so each tofu task points AWS_CONFIG_FILE at
  namespace-files/shared/aws_instance_role_profiles.ini: those names with regions and no
  credentials, so the SDK falls through to StagingKestraWorker's instance role.

concurrency:
  limit: 1
  behavior: FAIL

tasks:
  - id: get_target_host
    type: io.kestra.plugin.aws.cli.AwsCLI
    outputFiles:
      - host.txt
    commands:
      - |
        set -eo pipefail
        cat > /tmp/aws_query.sh <<'AWS_QUERY_SCRIPT'
        {{ read('aws_query.sh', namespace='shared') }}
        AWS_QUERY_SCRIPT
        chmod +x /tmp/aws_query.sh
        /tmp/aws_query.sh environmentKestraWorker staging | tr -d '\n' > host.txt
        rm -f /tmp/aws_query.sh

  - id: drift_check
    type: io.kestra.plugin.fs.ssh.Command
    host: "{{ read(outputs.get_target_host.outputFiles['host.txt']) }}"
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        export PATH="/usr/local/bin:$PATH"
        TF_VAR_aws_creation_key=$(/usr/local/bin/aws secretsmanager get-secret-value --region us-east-1 --secret-id staging/kestra-worker/tf-aws-creation-key --query SecretString --output text)
        TF_VAR_user_ssh_key=$(/usr/local/bin/aws secretsmanager get-secret-value --region us-east-1 --secret-id staging/kestra-worker/tf-user-ssh-key --query SecretString --output text)
        export TF_VAR_aws_creation_key TF_VAR_user_ssh_key
        cat > /tmp/kestra_aws_config <<'AWS_CONFIG'
        {{ read('aws_instance_role_profiles.ini', namespace='shared') }}
        AWS_CONFIG
        export AWS_CONFIG_FILE=/tmp/kestra_aws_config
        export AWS_PROFILE=east
        cd /src/infrastructure
        git pull
        cat > /tmp/tofu_drift_check.py <<'DRIFT_SCRIPT'
        {{ read('tofu_drift_check.py', namespace='shared') }}
        DRIFT_SCRIPT
        chmod +x /tmp/tofu_drift_check.py
        /opt/saltstack/salt/bin/python3 /tmp/tofu_drift_check.py \
          --env staging --root /src/infrastructure --plan-dir /tmp/tofu-plans/staging \
          --summary-file /tmp/drift_summary.txt \
          > /tmp/drift_results.json
        /opt/saltstack/salt/bin/python3 -c 'import json, sys; print("::" + json.dumps(dict(outputs=dict(summary=open(sys.argv[1]).read()))) + "::")' /tmp/drift_summary.txt
        rm -f /tmp/tofu_drift_check.py /tmp/drift_summary.txt

  - id: notify_result
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[staging_cron] Drift Check Report"
    htmlContent: "<pre>{{ outputs.drift_check.vars.summary }}</pre>"

  - id: await_review
    type: io.kestra.plugin.core.flow.Pause
    description: Review notify_result's report before resuming — nothing else applies, this only re-runs the plan.

  - id: recheck_after_resume
    type: io.kestra.plugin.fs.ssh.Command
    host: stagingkestra01.staging.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        export PATH="/usr/local/bin:$PATH"
        TF_VAR_aws_creation_key=$(/usr/local/bin/aws secretsmanager get-secret-value --region us-east-1 --secret-id staging/kestra-worker/tf-aws-creation-key --query SecretString --output text)
        TF_VAR_user_ssh_key=$(/usr/local/bin/aws secretsmanager get-secret-value --region us-east-1 --secret-id staging/kestra-worker/tf-user-ssh-key --query SecretString --output text)
        export TF_VAR_aws_creation_key TF_VAR_user_ssh_key
        cat > /tmp/kestra_aws_config <<'AWS_CONFIG'
        {{ read('aws_instance_role_profiles.ini', namespace='shared') }}
        AWS_CONFIG
        export AWS_CONFIG_FILE=/tmp/kestra_aws_config
        export AWS_PROFILE=east
        cd /src/infrastructure
        cat > /tmp/tofu_drift_check.py <<'DRIFT_SCRIPT'
        {{ read('tofu_drift_check.py', namespace='shared') }}
        DRIFT_SCRIPT
        chmod +x /tmp/tofu_drift_check.py
        /opt/saltstack/salt/bin/python3 /tmp/tofu_drift_check.py \
          --env staging --root /src/infrastructure --plan-dir /tmp/tofu-plans/staging
        rm -f /tmp/tofu_drift_check.py

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"
    timezone: UTC
    disabled: true

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[staging_cron] Drift Check Failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].taskId }}
