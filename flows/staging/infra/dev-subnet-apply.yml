id: dev-subnet-apply
namespace: staging.infra

description: |
  Plan -> human review -> apply for staging/dev-subnet only, run on stagingkestra01 against its
  /src/infrastructure checkout (whatever branch is checked out there, after a git pull). Use it to
  exercise real changes to the dev-subnet group -- a new server, a new volume -- and read back the
  results; the tf directory is fixed, not an input.

  tofu_plan reuses namespace-files/shared/tofu_drift_check.py (--group dev-subnet), so the email
  and task log have the same shape as drift-check's: changed resource addresses/actions in the
  email, full `tofu show` diff in the tofu_plan task log. The plan file is per-execution under
  /tmp/tofu-plans/staging/apply-<execution id>/, never one of drift-check's.

  When the plan has changes, the execution pauses at review_plan; nothing applies until it is
  resumed from the Kestra UI. tofu_apply applies that exact saved plan, so tofu rejects it as stale
  if the state moved since the plan. dev-subnet has no state lock (no use_lockfile, no DynamoDB);
  this flow's concurrency limit is the only guard against two concurrent applies.

  TF_VAR_* credentials come from Secrets Manager via StagingKestraWorker's instance role, and
  AWS_CONFIG_FILE points tofu's hardcoded profiles at that role -- same as drift-check.
  tofu_apply sets neither TF_VAR_*: a saved plan carries its variable values.

concurrency:
  limit: 1
  behavior: FAIL

tasks:
  - id: get_target_host
    type: io.kestra.plugin.aws.cli.AwsCLI
    outputFiles:
      - host.txt
    commands:
      - |
        set -eo pipefail
        cat > /tmp/aws_query.sh <<'AWS_QUERY_SCRIPT'
        {{ read('aws_query.sh', namespace='shared') }}
        AWS_QUERY_SCRIPT
        chmod +x /tmp/aws_query.sh
        /tmp/aws_query.sh environmentKestraWorker staging | tr -d '\n' > host.txt
        rm -f /tmp/aws_query.sh
  - id: tofu_plan
    type: io.kestra.plugin.fs.ssh.Command
    host: "{{ read(outputs.get_target_host.outputFiles['host.txt']) }}"
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        export PATH="/usr/local/bin:$PATH"
        TF_VAR_aws_creation_key=$(/usr/local/bin/aws secretsmanager get-secret-value --region us-east-1 --secret-id staging/kestra-worker/tf-aws-creation-key --query SecretString --output text)
        TF_VAR_user_ssh_key=$(/usr/local/bin/aws secretsmanager get-secret-value --region us-east-1 --secret-id staging/kestra-worker/tf-user-ssh-key --query SecretString --output text)
        export TF_VAR_aws_creation_key TF_VAR_user_ssh_key
        cat > /tmp/kestra_aws_config <<'AWS_CONFIG'
        {{ read('aws_instance_role_profiles.ini', namespace='shared') }}
        AWS_CONFIG
        export AWS_CONFIG_FILE=/tmp/kestra_aws_config
        export AWS_PROFILE=east
        cd /src/infrastructure
        git pull
        infra_commit=$(git log -1 --format='%h %s')
        echo "infrastructure at: $infra_commit"
        cat > /tmp/tofu_drift_check.py <<'DRIFT_SCRIPT'
        {{ read('tofu_drift_check.py', namespace='shared') }}
        DRIFT_SCRIPT
        chmod +x /tmp/tofu_drift_check.py
        /opt/saltstack/salt/bin/python3 /tmp/tofu_drift_check.py \
          --env staging --root /src/infrastructure --group dev-subnet \
          --plan-dir /tmp/tofu-plans/staging/apply-{{ execution.id }} \
          --summary-file /tmp/dev-subnet-summary-{{ execution.id }}.txt \
          > /tmp/dev-subnet-plan-{{ execution.id }}.json
        /opt/saltstack/salt/bin/python3 -c 'import json, sys; r = json.load(open(sys.argv[1]))["groups"][0]; print("::" + json.dumps(dict(outputs=dict(plan_status=r["status"], plan_file=r["plan_file"] or "", summary=open(sys.argv[2]).read(), infra_commit=sys.argv[3]))) + "::")' \
          /tmp/dev-subnet-plan-{{ execution.id }}.json /tmp/dev-subnet-summary-{{ execution.id }}.txt "$infra_commit"
        grep -Eq '"status": ?"drift"' /tmp/dev-subnet-plan-{{ execution.id }}.json || rm -rf /tmp/tofu-plans/staging/apply-{{ execution.id }}
        rm -f /tmp/tofu_drift_check.py /tmp/dev-subnet-plan-{{ execution.id }}.json /tmp/dev-subnet-summary-{{ execution.id }}.txt

  - id: apply_if_changed
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.tofu_plan.vars.plan_status == 'drift' }}"
    then:
      - id: notify_plan
        type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
        sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
        from: kestra@bondlink.com
        to:
          - jeff@bondlink.com
        subject: "Kestra[manual] Dev Subnet Plan Ready for Review"
        htmlContent: |
          <p>infrastructure at <code>{{ outputs.tofu_plan.vars.infra_commit }}</code>. Full diff is in the tofu_plan task log; resume to apply:
          <a href="https://kestra.prod.bondlink.org/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}">{{ execution.id }}</a></p>
          <pre>{{ outputs.tofu_plan.vars.summary }}</pre>

      - id: review_plan
        type: io.kestra.plugin.core.flow.Pause
        description: Review tofu_plan's log output before resuming -- nothing applies until this execution is manually resumed.

      - id: tofu_apply
        type: io.kestra.plugin.fs.ssh.Command
        host: stagingkestra01.staging.vpc
        port: "2007"
        username: bldeploy
        authMethod: PUBLIC_KEY
        privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
        strictHostKeyChecking: "no"
        commands:
          - |
            set -e
            export PATH="/usr/local/bin:$PATH"
            cat > /tmp/kestra_aws_config <<'AWS_CONFIG'
            {{ read('aws_instance_role_profiles.ini', namespace='shared') }}
            AWS_CONFIG
            export AWS_CONFIG_FILE=/tmp/kestra_aws_config
            export AWS_PROFILE=east
            cd /src/infrastructure/staging/dev-subnet
            tofu apply -input=false -no-color "{{ outputs.tofu_plan.vars.plan_file }}"
            # Human-readable form masks sensitive outputs; -json would print them in the clear.
            tofu output -no-color > /tmp/dev-subnet-outputs-{{ execution.id }}.txt
            cat /tmp/dev-subnet-outputs-{{ execution.id }}.txt
            /opt/saltstack/salt/bin/python3 -c 'import json, sys; print("::" + json.dumps(dict(outputs=dict(tofu_outputs=open(sys.argv[1]).read()))) + "::")' /tmp/dev-subnet-outputs-{{ execution.id }}.txt
            rm -rf /tmp/dev-subnet-outputs-{{ execution.id }}.txt /tmp/tofu-plans/staging/apply-{{ execution.id }}

      - id: notify_applied
        type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
        sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
        from: kestra@bondlink.com
        to:
          - jeff@bondlink.com
        subject: "Kestra[manual] Dev Subnet Apply Succeeded"
        htmlContent: |
          <p>Applied at infrastructure <code>{{ outputs.tofu_plan.vars.infra_commit }}</code>. Apply log is in the tofu_apply task log.</p>
          <pre>{{ outputs.tofu_plan.vars.summary }}</pre>
          <p>tofu output:</p>
          <pre>{{ outputs.tofu_apply.vars.tofu_outputs }}</pre>
    else:
      - id: notify_no_changes
        type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
        sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
        from: kestra@bondlink.com
        to:
          - jeff@bondlink.com
        subject: "Kestra[manual] Dev Subnet Plan: No Changes"
        htmlContent: |
          <p>infrastructure at <code>{{ outputs.tofu_plan.vars.infra_commit }}</code>; nothing to apply.</p>
          <pre>{{ outputs.tofu_plan.vars.summary }}</pre>

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 0 * * 0"
    timezone: UTC
    disabled: true

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[manual] Dev Subnet Apply Failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].taskId }}
