id: provision-dummy
namespace: staging.infra
disabled: true

description: |
  Exercises the untested tofu plan -> Pause -> apply mechanics
  (shared.infra/provision-server.yml has never been run for real, per
  INFRA_PROVISIONING.md) against staging/kestra_dummy -- a random_pet resource with
  zero AWS API calls -- before trusting that chain against real staging infrastructure.

concurrency:
  limit: 1
  behavior: FAIL

tasks:
  - id: tofu_plan
    type: io.kestra.plugin.fs.ssh.Command
    host: stagingkestra01.staging.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        export PATH="/usr/local/bin:$PATH"
        TF_VAR_aws_creation_key=$(/usr/local/bin/aws secretsmanager get-secret-value --region us-east-1 --secret-id staging/kestra-worker/tf-aws-creation-key --query SecretString --output text)
        TF_VAR_user_ssh_key=$(/usr/local/bin/aws secretsmanager get-secret-value --region us-east-1 --secret-id staging/kestra-worker/tf-user-ssh-key --query SecretString --output text)
        export TF_VAR_aws_creation_key TF_VAR_user_ssh_key
        cat > /tmp/kestra_aws_config <<'AWS_CONFIG'
        {{ read('aws_instance_role_profiles.ini', namespace='shared') }}
        AWS_CONFIG
        export AWS_CONFIG_FILE=/tmp/kestra_aws_config
        export AWS_PROFILE=east
        cd /src/infrastructure/staging/kestra_dummy
        git pull
        tofu init -input=false
        mkdir -p /tmp/tofu-plans/run-{{ execution.id }}
        tofu plan -input=false -out=/tmp/tofu-plans/run-{{ execution.id }}/plan

  - id: review_plan
    type: io.kestra.plugin.core.flow.Pause
    description: Review tofu_plan's log output before resuming -- nothing applies until this execution is manually resumed.

  - id: tofu_apply
    type: io.kestra.plugin.fs.ssh.Command
    host: stagingkestra01.staging.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        export PATH="/usr/local/bin:$PATH"
        TF_VAR_aws_creation_key=$(/usr/local/bin/aws secretsmanager get-secret-value --region us-east-1 --secret-id staging/kestra-worker/tf-aws-creation-key --query SecretString --output text)
        TF_VAR_user_ssh_key=$(/usr/local/bin/aws secretsmanager get-secret-value --region us-east-1 --secret-id staging/kestra-worker/tf-user-ssh-key --query SecretString --output text)
        export TF_VAR_aws_creation_key TF_VAR_user_ssh_key
        cat > /tmp/kestra_aws_config <<'AWS_CONFIG'
        {{ read('aws_instance_role_profiles.ini', namespace='shared') }}
        AWS_CONFIG
        export AWS_CONFIG_FILE=/tmp/kestra_aws_config
        export AWS_PROFILE=east
        cd /src/infrastructure/staging/kestra_dummy
        tofu apply -input=false /tmp/tofu-plans/run-{{ execution.id }}/plan

  - id: notify_success
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[manual] Provision Dummy Success"
    htmlContent: "Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} succeeded against staging/kestra_dummy."

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 0 * * 0"
    timezone: UTC
    disabled: true

finally:
  - id: cleanup_plans
    type: io.kestra.plugin.fs.ssh.Command
    host: stagingkestra01.staging.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        set -e
        cat > /tmp/tofu_plan_cleanup.sh <<'CLEANUP_SCRIPT'
        {{ read('tofu_plan_cleanup.sh', namespace='shared') }}
        CLEANUP_SCRIPT
        chmod +x /tmp/tofu_plan_cleanup.sh
        /tmp/tofu_plan_cleanup.sh {{ execution.id }}
        rm -f /tmp/tofu_plan_cleanup.sh

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[manual] Provision Dummy Failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].taskId }}
