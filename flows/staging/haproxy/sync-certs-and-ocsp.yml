id: sync-certs-and-ocsp
namespace: staging.haproxy

description: |
  Sync letsencrypt and haproxy/certs directories from the active load balancer to the
  passive one (pull mechanism, since pushing within scripts hit a readonly error).
  Migrated from Rundeck job Staging/haproxy/Sync Certs and OCSP (152e8047) —
  DISABLED in Rundeck (scheduleEnabled: false), so no trigger is defined here either.

  Two rsync commands collapsed into one SSH session (io.kestra.plugin.fs.ssh.Command
  joins all commands entries into a single exec channel).

tasks:
  - id: sync
    type: io.kestra.plugin.fs.ssh.Command
    host: staginglb02.staging.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - |
        sudo rsync -vurpgol staginglb01::haproxy /etc/haproxy/certs
        sudo rsync -vurpgol staginglb01::letsencrypt /etc/letsencrypt

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Load Balencer Sync Failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
