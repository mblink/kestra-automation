id: suricata
namespace: staging.backups

description: |
  Backup all suricata logs to S3. Migrated from Rundeck job Staging/Backups/Suricata
  (6139b5af) — originally targeted tags:bastion,proxy which at export time mapped to
  stagingjump01, staginglb01, staginglb02.

  Target hosts are now discovered dynamically via AWS instance tags
  (Environment=staging, NodeType=bastion or proxy, running) instead of that frozen
  list — live today this resolves to stagingjump, staginglb02, staginglb04 (staginglb01
  no longer exists; staginglb04 is new since the export). See bondlink-logs.yml for
  the discover_*_hosts task shape and its AwsCLI/IMDS prerequisite notes (already
  confirmed satisfied on prodsalt-arm, the host Kestra runs on).

  Uses io.kestra.plugin.core.flow.ForEach (values/tasks/concurrencyLimit, iteration
  var {{ taskrun.value }} — confirmed via bytecode + docs) instead of one hand-written
  task per host, since Rundeck's `parallel` strategy here maps directly onto it.

tasks:
  - id: discover_suricata_hosts
    type: io.kestra.plugin.aws.cli.AwsCLI
    outputFiles:
      - instances.json
    commands:
      - |
        aws ec2 describe-instances \
          --filters "Name=tag:Environment,Values=staging" "Name=tag:NodeType,Values=bastion,proxy" "Name=instance-state-name,Values=running" \
          --query "Reservations[].Instances[].{Name: Tags[?Key=='Name']|[0].Value, PrivateDnsName: NetworkInterfaces[0].PrivateDnsName}" \
          --output json > instances.json

  - id: sync_per_host
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ fromJson(read(outputs.discover_suricata_hosts.outputFiles['instances.json'])) }}"
    concurrencyLimit: 0
    tasks:
      - id: sync
        type: io.kestra.plugin.fs.ssh.Command
        host: "{{ fromJson(taskrun.value).PrivateDnsName }}"
        port: "2007"
        username: bldeploy
        authMethod: PUBLIC_KEY
        privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
        strictHostKeyChecking: "no"
        commands:
          - |
            set -e
            echo "Syncing suricata logs for {{ fromJson(taskrun.value).Name }} ({{ fromJson(taskrun.value).PrivateDnsName }})"
            /usr/local/bin/aws s3 sync /var/log/suricata/ s3://bondlink-data-east/suricata-logs/$HOSTNAME/ --exclude="*" --include="*.gz" --only-show-errors

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 5 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[staging_cron] Suricata Logs failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
