id: syslog-backup
namespace: staging.backups

description: |
  Backup all /var/log/sudoers*.gz to S3. Migrated from Rundeck job
  Staging/Backups/Syslog Backup (cba07245) — targets tags:staging, which at export
  time resolved to ALL 9 nodes in the fetched s3://bondlink-rundeck/staging.xml
  inventory (every staging node carries that tag).

  Target hosts are now discovered dynamically via AWS instance tags
  (Environment=staging, running) instead of the frozen 9-host list from that
  export — this naturally tracks the live staging fleet (currently 16 running
  instances, including several added since the export: stagingdb01/02/05,
  stagingredis-sa-arm, stagingops, ai-builds, develop-arm) and drops hosts that no
  longer exist (the old list's stagingweb01/02 and staginglb01 are gone). The
  backup script itself is a no-op on any host with no matching syslogs, so
  over-including a host here is harmless — same rationale as bondlink-logs.yml,
  which uses this identical discovery pattern (see that flow for the
  discover_*_hosts task shape and its AwsCLI/IMDS prerequisite notes, already
  confirmed satisfied on prodsalt-arm, the host Kestra runs on).

  Source job's dispatch.keepgoing=true (continue to other hosts even if one fails) —
  Kestra's ForEach doesn't stop other iterations when one fails unless told to, so
  no per-host error handling is needed to preserve that behavior. concurrencyLimit
  is capped at 3 (not unlimited) to throttle how many hosts run this in parallel.

  logs/syslogs.sh is now a Namespace File (namespace-files/shared/syslogs.sh in this
  repo, synced to Kestra's `shared` namespace), pulled in via
  {{ read('syslogs.sh', namespace='shared') }} instead of being duplicated inline —
  this is the first flow using this pattern, shared with prod.backups'
  syslog-backup.yml so the exact same script backs up both environments. Source of
  truth remains rundeck-jobs' logs/syslogs.sh; if that changes, update
  namespace-files/shared/syslogs.sh here and both flows pick it up automatically.

tasks:
  - id: discover_staging_hosts
    type: io.kestra.plugin.aws.cli.AwsCLI
    outputFiles:
      - instances.json
    commands:
      - |
        aws ec2 describe-instances \
          --filters "Name=tag:Environment,Values=staging" "Name=instance-state-name,Values=running" \
          --query "Reservations[].Instances[].{Name: Tags[?Key=='Name']|[0].Value, PrivateDnsName: NetworkInterfaces[0].PrivateDnsName}" \
          --output json > instances.json

  - id: backup_per_host
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ fromJson(read(outputs.discover_staging_hosts.outputFiles['instances.json'])) }}"
    concurrencyLimit: 3
    tasks:
      - id: backup
        type: io.kestra.plugin.fs.ssh.Command
        host: "{{ taskrun.value.PrivateDnsName }}"
        port: "2007"
        username: bldeploy
        authMethod: PUBLIC_KEY
        privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
        strictHostKeyChecking: "no"
        commands:
          - |
            set -e
            echo "Backing up syslogs for {{ taskrun.value.Name }} ({{ taskrun.value.PrivateDnsName }})"
            cat > /tmp/syslogs.sh <<'SYSLOG_SCRIPT'
            {{ read('syslogs.sh', namespace='shared') }}
            SYSLOG_SCRIPT
            chmod +x /tmp/syslogs.sh
            sudo /tmp/syslogs.sh
            rm -f /tmp/syslogs.sh

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 12 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Rundeck[staging_cron] Syslog Backup failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
