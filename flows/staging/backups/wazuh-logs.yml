id: wazuh-logs
namespace: staging.backups

description: |
  Backup all wazuh logs to S3. Runs on stagingsalt.

  PLACEHOLDER TRIGGER: the cron below ("0 6 * * *", once daily) is a placeholder,
  not a cadence anyone chose, and the trigger carries disabled: true. Pick a real
  schedule before enabling it.

  UNVERIFIED SCHEDULE: this cron is a reconstruction, not a carried-over source schedule.

tasks:
  - id: sync_logs
    type: io.kestra.plugin.fs.ssh.Command
    host: stagingsalt.staging.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - sudo /usr/local/bin/aws s3 sync /var/ossec/logs/alerts s3://bondlink-data-east/ossec-logs/staging/ --only-show-errors

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    timezone: UTC
    disabled: true

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[staging_cron] Wazuh Logs failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
