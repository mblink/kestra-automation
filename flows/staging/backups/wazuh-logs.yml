id: wazuh-logs
namespace: staging.backups

description: |
  Backup all wazuh logs. Migrated from Rundeck job Staging/Backups/Wazuh Logs
  (8a7df4c8) — DISABLED in Rundeck (scheduleEnabled: false). Targets tags:monitor,
  which resolves to stagingsalt only in the fetched staging.xml inventory.

  PLACEHOLDER TRIGGER: every flow in this repo is required to have a triggers:
  block (enforced by tests/test_flow_structure.py), but the source Rundeck job
  never had a schedule to carry over (it was disabled before one was ever set).
  The cron below ("0 6 * * *", once daily) is fabricated, not sourced from
  Rundeck — confirm/replace it with a real intended schedule before flipping
  disabled to false.

tasks:
  - id: sync_logs
    type: io.kestra.plugin.fs.ssh.Command
    host: stagingsalt.staging.vpc
    port: "2007"
    username: bldeploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
    strictHostKeyChecking: "no"
    commands:
      - sudo /usr/local/bin/aws s3 sync /var/ossec/logs/alerts s3://bondlink-data-east/ossec-logs/staging/ --only-show-errors

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    timezone: UTC
    disabled: true

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Kestra[staging_cron] Wazuh Logs failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
