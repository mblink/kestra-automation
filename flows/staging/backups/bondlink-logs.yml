id: bondlink-logs
namespace: staging.backups

description: |
  Backup everything matching /var/log/bondlink/*.gz to S3. Migrated from Rundeck job
  Staging/Backups/BondLink Logs (f08c430a).

  Target hosts are now discovered dynamically via AWS instance tags
  (Environment=staging, BondLinkApp=true, running) instead of a hardcoded list —
  this supersedes the prior GAP note about the Rundeck source job's tag filter
  ("tags:web, tags:corporate, tags:docker, tags:partner, tags:cron") only
  resolving "web" against the fetched inventory. BondLinkApp=true is the tag that
  actually captures every host running some part of the BondLink app stack (web,
  jobs, ice/BaseX, salt master, jump, dev/build boxes), matching the Rundeck job's
  original broad intent; the backup script itself no-ops cleanly on any host with
  no /var/log/bondlink/*.gz files, so over-including a host here is harmless.

  logs/bondlink_logs.py is a Namespace File (namespace-files/shared/bondlink_logs.py
  in this repo, synced to Kestra's `shared` namespace), pulled in via
  {{ read('bondlink_logs.py', namespace='shared') }} instead of being duplicated
  inline — the script's own ENV = "prod" if "prod" in HOSTNAME else "staging" logic
  already made it identical between environments, so it's shared with prod.backups'
  bondlink-logs.yml the same way staging/prod syslog-backup.yml share syslogs.sh.
  Source of truth remains rundeck-jobs' logs/bondlink_logs.py; if that changes,
  update namespace-files/shared/bondlink_logs.py here and both flows pick it up
  automatically. Runs via /opt/saltstack/salt/bin/python3 (the salt onedir's bundled
  Python 3.14), not the system python3 (3.12 on these hosts) — the salt
  onedir env is where `more_itertools`/`boto3`/`botocore` are actually
  installed; the system python3 lacks them. Never invoke this as a bare
  `python3 script.py` (PATH resolves to the system interpreter, silently
  ignoring the script's own shebang).

  PREREQUISITE (confirmed satisfied on prodsalt-arm, the host Kestra itself runs
  on): discover_bondlink_hosts relies on prodsalt-arm's EC2 instance role for AWS
  credentials (no injected keys) — AwsCLI runs its `aws` call in a sibling Docker
  container, one network hop past the Kestra container's own IMDS access, so IMDSv2
  needs a hop limit >= 2 or credential/region resolution silently fails. Verified:
  prodsalt-arm's IamInstanceProfile is ProdMonitor, which has the AWS-managed
  ReadOnlyAccess policy attached (covers ec2:DescribeInstances), and its
  MetadataOptions are already HttpPutResponseHopLimit=3 / HttpTokens=required. No
  infra change needed for this flow to work.

tasks:
  - id: discover_bondlink_hosts
    type: io.kestra.plugin.aws.cli.AwsCLI
    outputFiles:
      - instances.json
    commands:
      - |
        aws ec2 describe-instances \
          --filters "Name=tag:Environment,Values=staging" "Name=tag:BondLinkApp,Values=true" "Name=instance-state-name,Values=running" \
          --query "Reservations[].Instances[].{Name: Tags[?Key=='Name']|[0].Value, PrivateDnsName: NetworkInterfaces[0].PrivateDnsName}" \
          --output json > instances.json

  - id: backup_per_host
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ fromJson(read(outputs.discover_bondlink_hosts.outputFiles['instances.json'])) }}"
    concurrencyLimit: 3
    tasks:
      - id: backup
        type: io.kestra.plugin.fs.ssh.Command
        host: "{{ fromJson(taskrun.value).PrivateDnsName }}"
        port: "2007"
        username: bldeploy
        authMethod: PUBLIC_KEY
        privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
        strictHostKeyChecking: "no"
        commands:
          - |
            set -e
            echo "Backing up BondLink logs for {{ fromJson(taskrun.value).Name }} ({{ fromJson(taskrun.value).PrivateDnsName }})"
            cat > /tmp/bondlink_logs.py <<'BONDLINK_LOGS_SCRIPT'
            {{ read('bondlink_logs.py', namespace='shared') }}
            BONDLINK_LOGS_SCRIPT
            sudo /opt/saltstack/salt/bin/python3 /tmp/bondlink_logs.py
            sudo rm -f /tmp/bondlink_logs.py

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "15 7 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.sendgrid.SendGridMailSend
    sendgridApiKey: "{{ secret('SENDGRID_API_KEY') }}"
    from: kestra@bondlink.com
    to:
      - jeff@bondlink.com
    subject: "Rundeck[staging_cron] BondLink Logs failed"
    htmlContent: |
      Execution {{ execution.id }} of {{ flow.namespace }}.{{ flow.id }} failed.
      Failed task: {{ tasksWithState('FAILED')[0].id }}
