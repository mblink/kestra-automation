id: kestra-bootstrap
namespace: system

description: |
  LOCAL-DEV CONVENIENCE ONLY — syncs this repo's flows/ tree into a local Kestra
  instance using Kestra's own internal git-sync plugin. This is NOT the production
  sync mechanism: per the salt/kestra state (id_rsa_bldeploy + GitHub PAT askpass
  script), production instead does a host-level `git pull` (mirroring rundeck-jobs'
  sync_git.sh) followed by `kestra flow namespace update <ns> <dir> --server ...
  --user=USER:PASS` (OSS CLI auth is basic-auth, no --api-token — that's
  Enterprise-only).

  Most shared scripts are still inlined directly into each flow's commands
  (quoted heredocs). Two exceptions, both as real Namespace Files synced by the
  tasks below (see salt/kestra's sync-flows.sh for the production side, which
  loops over every namespace-files/<namespace>/ directory generically — this
  flow needs one explicit task per namespace since Kestra flows can't loop):
  scripts genuinely shared across environments (starting with logs/syslogs.sh)
  live under namespace-files/shared/, pulled in via
  {{ read('syslogs.sh', namespace='shared') }}; and scripts that just need to
  avoid Kestra's Pebble template engine mis-parsing their content (e.g. bash's
  `${#array[@]}` length syntax contains a literal `{#`, which Pebble parses as
  an unclosed comment — see clean-corp-preview-s3.yml) live under
  namespace-files/prod.aws/, pulled in via {{ read('<file>') }} (no namespace=
  override needed since that's the calling flow's own namespace already).

  Run manually (no trigger yet) until validated — dryRun: true; flip to false once
  you've reviewed a dry-run diff in the execution output.

  Requires a GITHUB_SSH_PRIVATE_KEY secret (personal key with read access to this
  repo) provisioned before running for real.

tasks:
  - id: sync_prod_flows
    type: io.kestra.plugin.git.SyncFlows
    url: git@github.com:mblink/kestra-automation.git
    branch: main
    privateKey: "{{ secret('GITHUB_SSH_PRIVATE_KEY') }}"
    gitDirectory: flows/prod
    targetNamespace: prod
    includeChildNamespaces: true
    delete: true
    dryRun: true

  - id: sync_shared_namespace_files
    type: io.kestra.plugin.git.SyncNamespaceFiles
    url: git@github.com:mblink/kestra-automation.git
    branch: main
    privateKey: "{{ secret('GITHUB_SSH_PRIVATE_KEY') }}"
    namespace: shared
    gitDirectory: namespace-files/shared
    delete: true
    dryRun: true

  - id: sync_prod_aws_namespace_files
    type: io.kestra.plugin.git.SyncNamespaceFiles
    url: git@github.com:mblink/kestra-automation.git
    branch: main
    privateKey: "{{ secret('GITHUB_SSH_PRIVATE_KEY') }}"
    namespace: prod.aws
    gitDirectory: namespace-files/prod.aws
    delete: true
    dryRun: true
